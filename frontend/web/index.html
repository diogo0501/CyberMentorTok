<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CyberMentorTok</title>
  <link rel="stylesheet" href="tiktok.css?v=20260804-17">
</head>
<body>
  <main class="phone" aria-label="CyberMentorTok feed">
    <video id="backgroundVideo" class="background-video" playsinline muted loop preload="auto"></video>
    <section id="feed" class="feed"></section>
    <button id="libraryBackdrop" class="library-backdrop" type="button" aria-label="Close search"></button>

    <header class="top-bar">
      <button id="libraryButton" class="plain-button counter" type="button">0</button>
      <nav class="tabs" aria-label="Feed mode">
        <button class="tab muted" type="button">Following</button>
        <button class="tab active" type="button">For You</button>
      </nav>
      <button id="searchButton" class="plain-button search" type="button" aria-label="Search videos">⌕</button>
    </header>

    <footer class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" type="button"><span>⌂</span><small>Home</small></button>
      <button id="navSearchButton" class="nav-item" type="button"><span>⌕</span><small>Search</small></button>
      <button id="createButton" class="create-button" type="button" aria-label="Open video library">+</button>
      <button class="nav-item" type="button"><span>▥</span><small>Progress</small></button>
      <button class="nav-item" type="button"><span>◯</span><small>Profile</small></button>
    </footer>

    <aside id="library" class="library" aria-label="Pipeline output videos">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="library-header">
        <div>
          <strong>Pipeline outputs</strong>
          <span id="libraryCount">0 videos</span>
        </div>
        <button id="closeLibraryButton" type="button" aria-label="Close">×</button>
      </div>
      <label class="search-box">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Search title, concept, id" autocomplete="off">
        <button id="clearSearchButton" type="button" aria-label="Clear search">×</button>
      </label>
      <div id="libraryList" class="library-list"></div>
    </aside>
  </main>

  <script src="tiktok.js?v=20260804-17"></script>
</body>
</html>
