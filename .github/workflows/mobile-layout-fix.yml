name: Mobile layout fix

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch main index
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          html = html.replace('width: min(100vw, 390px);', 'width: min(100vw, 430px);', 1)

          old_media = '''.background-video,
          .slide video {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            object-fit: cover;
            image-rendering: auto;
            background: #000;
          }

          .background-video {
            height: 118%;
            top: -9%;
            z-index: 0;
          }

          .slide video {
            inset: 0;
            height: 100%;
            background: transparent;
          }'''.replace('          ', '')
          new_media = '''.background-video,
          .slide video {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            image-rendering: auto;
          }

          .background-video {
            height: 118%;
            top: -9%;
            z-index: 0;
            object-fit: cover;
            object-position: center;
            background: #000;
          }

          .slide video {
            inset: 0;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            background: transparent;
            transform: none !important;
          }'''.replace('          ', '')
          if old_media not in html:
              raise SystemExit("media CSS block not found")
          html = html.replace(old_media, new_media, 1)

          old_caption = '''.caption {
            position: absolute;
            left: 14px;
            right: 84px;
            bottom: calc(88px + env(safe-area-inset-bottom));
            color: #fff;
            text-shadow: 0 2px 12px #000;
          }

          .caption strong {
            display: block;
            margin-bottom: 7px;
            overflow: hidden;
            font-size: 16px;
            font-weight: 800;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .caption p {
            display: -webkit-box;
            margin: 0 0 8px;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            font-size: 15px;
            font-weight: 650;
            line-height: 1.25;
          }'''.replace('          ', '')
          new_caption = '''.caption {
            position: absolute;
            left: max(12px, calc(10px + env(safe-area-inset-left)));
            right: max(72px, calc(68px + env(safe-area-inset-right)));
            bottom: calc(82px + env(safe-area-inset-bottom));
            color: #fff;
            text-shadow: 0 2px 12px #000;
            overflow: visible;
            transform: none !important;
          }

          .caption strong {
            display: block;
            margin-bottom: 6px;
            overflow: visible;
            font-size: clamp(13px, 3.8vw, 16px);
            font-weight: 800;
            line-height: 1.18;
            text-overflow: clip;
            white-space: normal;
            overflow-wrap: anywhere;
          }

          .caption p {
            display: block;
            margin: 0 0 8px;
            overflow: visible;
            font-size: clamp(13px, 3.65vw, 15px);
            font-weight: 650;
            line-height: 1.3;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: normal;
            hyphens: auto;
          }'''.replace('          ', '')
          if old_caption not in html:
              raise SystemExit("caption CSS block not found")
          html = html.replace(old_caption, new_caption, 1)

          responsive = '''

          /* Safe content zones for narrow mobile viewports. */
          @media (max-width: 390px) {
            .caption {
              left: max(10px, calc(8px + env(safe-area-inset-left)));
              right: max(64px, calc(60px + env(safe-area-inset-right)));
              bottom: calc(78px + env(safe-area-inset-bottom));
            }

            .caption p {
              font-size: clamp(12.5px, 3.55vw, 14px);
              line-height: 1.28;
            }

            .rail {
              right: max(4px, env(safe-area-inset-right));
              gap: 13px;
            }

            .action {
              width: 52px;
            }

            .action b {
              font-size: 29px;
            }
          }

          @media (max-width: 340px) {
            .caption {
              right: max(58px, calc(54px + env(safe-area-inset-right)));
            }

            .caption strong,
            .caption p {
              font-size: 12.5px;
            }

            .rail {
              transform: scale(.9);
              transform-origin: bottom right;
            }
          }
          '''.replace('          ', '')
          html = html.replace('\n  </style>', responsive + '\n  </style>', 1)

          old_video_transform = 'mask.style.transform = `translate3d(0, ${distance * 18}px, 0) scale(${1 + absoluteDistance * 0.035})`;'
          if old_video_transform not in html:
              raise SystemExit("video transition transform not found")
          html = html.replace(old_video_transform, 'mask.style.transform = `translate3d(0, ${distance * 10}px, 0)`;', 1)

          old_overlay = '''slide.querySelectorAll(".caption, .rail").forEach((element) => {
                element.style.transform = `translate3d(0, ${distance * -26}px, 0) scale(${1 - absoluteDistance * 0.03})`;
                element.style.opacity = String(1 - absoluteDistance * 0.45);
              });'''.replace('              ', '')
          new_overlay = '''slide.querySelectorAll(".caption, .rail").forEach((element) => {
                element.style.opacity = String(1 - absoluteDistance * 0.35);
              });'''.replace('              ', '')
          if old_overlay not in html:
              raise SystemExit("overlay transition transform not found")
          html = html.replace(old_overlay, new_overlay, 1)

          path.write_text(html, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-layout-fix.yml
          git add index.html
          git commit -m "Fix mobile video framing and caption clipping"
          git push origin HEAD:main
