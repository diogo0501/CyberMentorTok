name: UI audio cleanup

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch single-file app
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('grid-template-columns: 56px 1fr 56px;', 'grid-template-columns: 1fr auto 1fr;')
          s = s.replace('      <button id="libraryButton" class="plain-button counter" type="button">0</button>\n', '      <span aria-hidden="true"></span>\n')
          s = s.replace('const libraryButton = document.getElementById("libraryButton");\n', '')
          s = s.replace('libraryButton.addEventListener("click", openLibrary);\n', '')
          s = s.replace('  libraryButton.textContent = visibleVideos.length ? `${activeIndex + 1}/${visibleVideos.length}` : "0/0";\n', '')

          s = s.replace('function shouldUseFullVideo(video) {\n  if (!video?.full_url) return false;\n  return PREFER_MP4_VIDEO || !(video.mask_url && video.audio_url);\n}', 'function shouldUseFullVideo(video) {\n  // A single MP4 player is the most reliable path for first-load audio and A/V sync.\n  // Keep mask + detached audio only as a fallback when no full render exists.\n  return Boolean(video?.full_url);\n}')

          s = s.replace('    <small>♪ ${escapeHtml(difficultyFor(video))} - ${escapeHtml(formatBytes(video.size_bytes))}</small>\n', '')
          s = s.replace('<div class="avatar">${(difficultyFor(video).match(/\\d/) || ["C"])[0]}</div>', '<div class="avatar">C</div>')
          s = s.replace('${escapeHtml(conceptFor(video))} · ${escapeHtml(difficultyFor(video))}', '${escapeHtml(conceptFor(video))}')

          # Remove unused badge CSS entirely.
          start = s.find('.caption small {')
          if start != -1:
            end = s.find('\n}\n', start)
            if end != -1:
              s = s[:start] + s[end+3:]

          # Counter styling is no longer used.
          start = s.find('.counter {')
          if start != -1:
            end = s.find('\n}\n', start)
            if end != -1:
              s = s[:start] + s[end+3:]

          p.write_text(s, encoding='utf-8')

      - name: Commit patch to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use unified video audio and simplify feed UI"
          git push origin HEAD:main
