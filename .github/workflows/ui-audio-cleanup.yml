name: UI audio cleanup

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix duplicate media layer
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '.slide[data-media-kind="full"] video {\n  background: #000;\n}\n'
          if marker not in s:
              anchor = '.slide video {\n  inset: 0;\n  height: 100%;\n  object-fit: contain;\n  object-position: center center;\n  background: transparent;\n  transform: none !important;\n}\n'
              if anchor not in s:
                  raise SystemExit('video CSS anchor not found')
              s = s.replace(anchor, anchor + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix duplicate background video rendering"
          git push origin HEAD:main
