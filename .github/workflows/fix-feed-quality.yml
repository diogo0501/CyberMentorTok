name: Fix feed quality

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_bg = '''.background-video {
  height: 118%;
  top: -9%;
  z-index: 0;
  object-fit: cover;
  object-position: center;
  background: #000;
}'''
          new_bg = '''.background-video {
  height: 100%;
  top: 0;
  z-index: 0;
  object-fit: cover;
  object-position: center;
  background: #000;
  transform: none !important;
}'''
          if old_bg in s:
            s = s.replace(old_bg, new_bg, 1)

          full_marker = '''.slide[data-media-kind="full"] video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
}'''
          if full_marker not in s:
            anchor = '''.slide[data-media-kind="full"] {
  background: #000;
}'''
            if anchor in s:
              s = s.replace(anchor, anchor + '\n\n' + full_marker, 1)

          old_mode = '''function shouldUseFullVideo(video) {
  // A single MP4 player is the most reliable path for first-load audio and A/V sync.
  // Keep mask + detached audio only as a fallback when no full render exists.
  return Boolean(video?.full_url);
}'''
          new_mode = '''function shouldUseFullVideo(video) {
  // Prefer original background + transparent mask on browsers that support WebM.
  // full.mp4 remains the compatibility fallback, avoiding an unnecessary re-encode
  // in the normal path and preserving the source gameplay quality.
  if (!video?.full_url) return false;
  return PREFER_MP4_VIDEO || !(video.mask_url && video.audio_url);
}'''
          if old_mode in s:
            s = s.replace(old_mode, new_mode, 1)

          old_scroll = '''function updateBackgroundScroll() {
  if (backgroundVideo.dataset.enabled === "1") {
    const slideHeight = Math.max(1, feed.clientHeight);
    const progress = (feed.scrollTop % slideHeight) / slideHeight;
    const offset = (progress - 0.5) * -18;
    backgroundVideo.style.transform = `translate3d(0, ${offset}%, 0)`;
  } else {
    backgroundVideo.style.transform = "none";
  }
  updateSlideAnimations();
}'''
          new_scroll = '''function updateBackgroundScroll() {
  // Preserve native framing and sharpness. The old parallax enlarged the source
  // and introduced unnecessary resampling while scrolling.
  backgroundVideo.style.transform = "none";
  updateSlideAnimations();
}'''
          if old_scroll in s:
            s = s.replace(old_scroll, new_scroll, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit fix if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore fullscreen original-quality video rendering"
            git push origin HEAD:main
          fi
