name: Refactor static app

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Split monolithic HTML into maintainable static files
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          root = Path('.')
          source = (root / 'index.html').read_text(encoding='utf-8')

          style_match = re.search(r'<style>\s*(.*?)\s*</style>', source, re.S)
          if not style_match:
              raise SystemExit('Could not locate embedded CSS')
          css = style_match.group(1).strip() + '\n'

          scripts = re.findall(r'<script>\s*(.*?)\s*</script>', source, re.S)
          data_script = next((script for script in scripts if 'window.__STATIC_VIDEO_DATA__' in script), None)
          app_js = next((script for script in scripts if 'const STATIC_VIDEOS' in script), None)
          if not data_script or not app_js:
              raise SystemExit('Could not locate embedded video data or application JavaScript')

          data_match = re.search(r'window\.__STATIC_VIDEO_DATA__\s*=\s*(\[.*\]);\s*$', data_script, re.S)
          if not data_match:
              raise SystemExit('Could not parse embedded video data')
          videos = json.loads(data_match.group(1))
          if not isinstance(videos, list) or not videos:
              raise SystemExit('Video dataset is empty or invalid')

          body_match = re.search(r'<body>\s*(.*?)\s*<script>', source, re.S)
          if not body_match:
              raise SystemExit('Could not locate application body')
          body_markup = body_match.group(1).strip()

          # Restore native-quality background framing. The previous 118% zoom and
          # scroll parallax forced browser resampling and reduced apparent sharpness.
          css = css.replace(
              '''.background-video {
          height: 118%;
          top: -9%;
          z-index: 0;
          object-fit: cover;
          object-position: center;
          background: #000;
        }'''.replace('        ', ''),
              '''.background-video {
          height: 100%;
          top: 0;
          z-index: 0;
          object-fit: cover;
          object-position: center;
          background: #000;
          transform: none !important;
        }'''.replace('        ', ''),
              1,
          )

          full_rule = '''.slide[data-media-kind="full"] video {
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center center;
        }'''.replace('        ', '')
          if full_rule not in css:
              anchor = '''.slide[data-media-kind="full"] {
          background: #000;
        }'''.replace('        ', '')
              css = css.replace(anchor, anchor + '\n\n' + full_rule, 1)

          app_js = app_js.strip() + '\n'
          old_mode = '''function shouldUseFullVideo(video) {
          // A single MP4 player is the most reliable path for first-load audio and A/V sync.
          // Keep mask + detached audio only as a fallback when no full render exists.
          return Boolean(video?.full_url);
        }'''.replace('        ', '')
          new_mode = '''function shouldUseFullVideo(video) {
          // Prefer the original gameplay plus transparent mask where WebM is supported.
          // The precomposed MP4 remains the compatibility fallback for iOS and browsers
          // without a usable mask/audio path.
          if (!video?.full_url) return false;
          return PREFER_MP4_VIDEO || !(video.mask_url && video.audio_url);
        }'''.replace('        ', '')
          if old_mode not in app_js:
              raise SystemExit('Expected media selection function was not found')
          app_js = app_js.replace(old_mode, new_mode, 1)

          old_scroll = '''function updateBackgroundScroll() {
          if (backgroundVideo.dataset.enabled === "1") {
            const slideHeight = Math.max(1, feed.clientHeight);
            const progress = (feed.scrollTop % slideHeight) / slideHeight;
            const offset = (progress - 0.5) * -18;
            backgroundVideo.style.transform = `translate3d(0, ${offset}%, 0)`;
          } else {
            backgroundVideo.style.transform = "none";
          }
          updateSlideAnimations();
        }'''.replace('        ', '')
          new_scroll = '''function updateBackgroundScroll() {
          backgroundVideo.style.transform = "none";
          updateSlideAnimations();
        }'''.replace('        ', '')
          if old_scroll not in app_js:
              raise SystemExit('Expected background scroll function was not found')
          app_js = app_js.replace(old_scroll, new_scroll, 1)

          (root / 'assets').mkdir(exist_ok=True)
          data_dir = root / 'data'
          data_dir.mkdir(exist_ok=True)
          for stale in data_dir.glob('videos-*.js'):
              stale.unlink()

          (root / 'assets' / 'app.css').write_text(css, encoding='utf-8')
          (root / 'assets' / 'app.js').write_text(app_js, encoding='utf-8')

          # Keep every data file comfortably below connector response limits.
          target_bytes = 45000
          chunks = []
          current = []
          current_bytes = 0
          for video in videos:
              serialized = json.dumps(video, ensure_ascii=False, separators=(',', ':'))
              size = len(serialized.encode('utf-8')) + 2
              if current and current_bytes + size > target_bytes:
                  chunks.append(current)
                  current = []
                  current_bytes = 0
              current.append(video)
              current_bytes += size
          if current:
              chunks.append(current)

          chunk_paths = []
          for index, chunk in enumerate(chunks, 1):
              filename = f'videos-{index:03d}.js'
              path = data_dir / filename
              parts = [json.dumps(item, ensure_ascii=False, separators=(',', ':')) for item in chunk]
              content = (
                  'window.__STATIC_VIDEO_DATA__ = window.__STATIC_VIDEO_DATA__ || [];\n'
                  'window.__STATIC_VIDEO_DATA__.push(\n  '
                  + ',\n  '.join(parts)
                  + '\n);\n'
              )
              path.write_text(content, encoding='utf-8')
              if path.stat().st_size > 60000:
                  raise SystemExit(f'{path} exceeded the intended connector-safe size')
              chunk_paths.append(path.as_posix())

          script_tags = '\n  '.join(f'<script src="{path}"></script>' for path in chunk_paths)
          main_html = f'''<!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="theme-color" content="#000000">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <title>CyberMentorTok</title>
          <link rel="stylesheet" href="assets/app.css">
        </head>
        <body>
        {body_markup}
          <script>
            window.__ASSET_BASE__ = "";
            window.__STATIC_MANIFEST_URL__ = "";
            window.__STATIC_VIDEO_DATA__ = [];
          </script>
          {script_tags}
          <script src="assets/app.js"></script>
        </body>
        </html>
        '''.replace('        ', '')
          (root / 'main.html').write_text(main_html, encoding='utf-8')

          # Keep index.html as a tiny compatibility entry point for GitHub Pages and
          # existing bookmarks while making main.html the real application entry.
          index_html = '''<!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=main.html">
          <title>CyberMentorTok</title>
          <script>location.replace("main.html");</script>
        </head>
        <body><a href="main.html">Open CyberMentorTok</a></body>
        </html>
        '''.replace('        ', '')
          (root / 'index.html').write_text(index_html, encoding='utf-8')

          # Remove this one-shot workflow from the resulting production tree.
          workflow = root / '.github' / 'workflows' / 'fix-feed-quality.yml'
          if workflow.exists():
              workflow.unlink()

          print(f'Refactored {len(videos)} videos into {len(chunks)} connector-safe data files.')
          print(f'app.css: {(root / "assets" / "app.css").stat().st_size} bytes')
          print(f'app.js: {(root / "assets" / "app.js").stat().st_size} bytes')
          print(f'main.html: {(root / "main.html").stat().st_size} bytes')

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor static app into maintainable files"
          git push origin HEAD:main
