<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>CyberMentorTok</title>
  <style>
    :root{
      color-scheme:dark;
      --app-height:100dvh;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --nav-h:calc(56px + var(--safe-bottom));
      --text:#fff;
      --muted:rgba(255,255,255,.68);
      --glass:rgba(18,18,18,.72);
      --hairline:rgba(255,255,255,.12);
      --cyan:#25f4ee;
      --pink:#fe2c55;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
      background:#000;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden;touch-action:pan-y}
    body{position:fixed;inset:0;color:var(--text);overscroll-behavior:none}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{
      position:fixed;inset:0;margin:auto;width:min(100vw,430px);height:var(--app-height);
      overflow:hidden;background:#000;isolation:isolate;
    }
    @media (min-width:600px){
      body{background:#111}
      .app{box-shadow:0 0 0 1px #2a2a2a,0 24px 80px rgba(0,0,0,.7)}
    }
    .ambient{
      position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;
      z-index:0;filter:saturate(.95) brightness(.72);background:#000;
      pointer-events:none;transform:translateZ(0);
    }
    .feed{
      position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;
      -webkit-overflow-scrolling:touch;scroll-snap-type:y mandatory;
      overscroll-behavior-y:none;scrollbar-width:none;
    }
    .feed::-webkit-scrollbar{display:none}
    .slide{
      position:relative;width:100%;height:var(--app-height);min-height:var(--app-height);
      scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:transparent;
      contain:layout paint style;
    }
    .media{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      background:transparent;transform:translateZ(0);pointer-events:none;
    }
    .media.full{background:#000}
    .scrim-top,.scrim-bottom{position:absolute;left:0;right:0;pointer-events:none;z-index:2}
    .scrim-top{
      top:0;height:150px;
      background:linear-gradient(to bottom,rgba(0,0,0,.56),rgba(0,0,0,.15) 50%,transparent);
    }
    .scrim-bottom{
      bottom:0;height:44%;
      background:linear-gradient(to bottom,transparent,rgba(0,0,0,.18) 25%,rgba(0,0,0,.72) 70%,rgba(0,0,0,.92));
    }
    .topbar{
      position:absolute;z-index:10;top:0;left:0;right:0;
      padding:calc(var(--safe-top) + 8px) calc(12px + var(--safe-right)) 8px calc(12px + var(--safe-left));
      display:grid;grid-template-columns:44px 1fr 44px;align-items:start;
      pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.8);
    }
    .topbar button{pointer-events:auto}
    .count,.iconbtn,.tab,.nav-item,.rail-btn{
      border:0;color:#fff;background:transparent;padding:0;
    }
    .count{
      min-width:44px;height:36px;font-size:12px;font-weight:700;text-align:left;
      opacity:.92;
    }
    .tabs{display:flex;justify-content:center;gap:20px;padding-top:3px}
    .tab{
      position:relative;height:32px;font-size:16px;font-weight:650;color:rgba(255,255,255,.62);
    }
    .tab.active{color:#fff}
    .tab.active::after{
      content:"";position:absolute;left:50%;bottom:0;width:22px;height:2.5px;border-radius:3px;
      transform:translateX(-50%);background:#fff;
    }
    .iconbtn{
      width:44px;height:36px;display:grid;place-items:center;margin-left:auto;border-radius:18px;
    }
    .iconbtn:active,.rail-btn:active,.nav-item:active{transform:scale(.94)}
    svg{display:block}
    .caption{
      position:absolute;z-index:5;left:calc(14px + var(--safe-left));right:88px;
      bottom:calc(var(--nav-h) + 18px);text-shadow:0 1px 7px rgba(0,0,0,.95);
      pointer-events:none;
    }
    .caption .handle{font-size:15px;font-weight:750;margin-bottom:7px}
    .caption .copy{
      margin:0 0 9px;font-size:14.5px;line-height:1.3;font-weight:520;
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
    }
    .caption .meta{
      display:flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:rgba(255,255,255,.9)
    }
    .pill{
      display:inline-flex;align-items:center;min-height:26px;padding:0 9px;border-radius:9px;
      background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.13);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    }
    .rail{
      position:absolute;z-index:6;right:calc(8px + var(--safe-right));
      bottom:calc(var(--nav-h) + 22px);display:flex;flex-direction:column;align-items:center;gap:14px;
      text-shadow:0 1px 7px rgba(0,0,0,.95);
    }
    .avatar{
      position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
      border:2px solid #fff;background:linear-gradient(135deg,#0d9fa4,var(--pink));font-weight:800;
      box-shadow:0 2px 12px rgba(0,0,0,.45);
    }
    .avatar::after{
      content:"+";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
      width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
      background:var(--pink);border:2px solid #000;font-size:14px;font-weight:800;
    }
    .rail-btn{
      width:52px;min-height:47px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:3px;transition:transform .08s ease;
    }
    .rail-btn span{font-size:10.5px;font-weight:700;max-width:52px;overflow:hidden;text-overflow:ellipsis}
    .disc{
      width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
      background:conic-gradient(#111,#4b4b4b,#111,#292929,#111);
      border:1px solid rgba(255,255,255,.2);animation:spin 5s linear infinite;
    }
    .disc::after{content:"";width:14px;height:14px;border-radius:50%;background:#ddd}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bottomnav{
      position:absolute;z-index:10;left:0;right:0;bottom:0;
      min-height:var(--nav-h);padding:6px calc(8px + var(--safe-right)) var(--safe-bottom) calc(8px + var(--safe-left));
      display:grid;grid-template-columns:repeat(5,1fr);align-items:start;
      background:linear-gradient(to bottom,rgba(0,0,0,.42),rgba(0,0,0,.91) 28%,#000);
      border-top:1px solid rgba(255,255,255,.08);
    }
    .nav-item{
      height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;color:rgba(255,255,255,.66);transition:transform .08s ease;
    }
    .nav-item.active{color:#fff}
    .nav-item small{font-size:9.5px;font-weight:600}
    .create{
      width:44px;height:28px;border:0;border-radius:7px;margin-top:8px;justify-self:center;
      background:#fff;color:#000;font-size:24px;font-weight:700;line-height:1;
      box-shadow:-4px 0 0 var(--cyan),4px 0 0 var(--pink);
    }
    .pause-toast{
      position:absolute;z-index:8;top:50%;left:50%;width:72px;height:72px;border-radius:50%;
      transform:translate(-50%,-50%) scale(.85);display:grid;place-items:center;
      opacity:0;pointer-events:none;background:rgba(0,0,0,.42);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      transition:opacity .14s ease,transform .14s ease;
    }
    .slide.paused .pause-toast{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .sound-gate{
      position:absolute;z-index:9;left:50%;top:calc(var(--safe-top) + 58px);
      transform:translateX(-50%);border:1px solid rgba(255,255,255,.18);border-radius:999px;
      padding:7px 11px;background:rgba(0,0,0,.48);color:#fff;font-size:12px;font-weight:650;
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      opacity:0;pointer-events:none;transition:opacity .18s ease;
    }
    .sound-gate.show{opacity:1}
    .sheet-backdrop{
      position:absolute;z-index:20;inset:0;border:0;background:rgba(0,0,0,.5);
      opacity:0;pointer-events:none;transition:opacity .2s ease;
    }
    .sheet-backdrop.open{opacity:1;pointer-events:auto}
    .sheet{
      position:absolute;z-index:21;left:0;right:0;bottom:0;height:min(82%,720px);
      display:grid;grid-template-rows:auto auto 1fr;
      background:rgba(18,18,18,.96);border-radius:18px 18px 0 0;
      padding-bottom:var(--safe-bottom);transform:translate3d(0,102%,0);
      transition:transform .32s cubic-bezier(.2,.85,.2,1);
      box-shadow:0 -16px 50px rgba(0,0,0,.45);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    }
    .sheet.open{transform:translate3d(0,0,0)}
    .grabber{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:8px auto 3px}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px}
    .sheet-head strong{font-size:18px}
    .sheet-head small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
    .close{
      width:32px;height:32px;border:0;border-radius:50%;display:grid;place-items:center;
      color:#fff;background:rgba(255,255,255,.1);font-size:20px;
    }
    .searchbox{
      margin:0 12px 10px;height:40px;border-radius:10px;display:flex;align-items:center;gap:8px;
      padding:0 11px;background:rgba(255,255,255,.09);color:var(--muted);
    }
    .searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:15px}
    .searchbox input::placeholder{color:#8e8e93}
    .list{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 10px 16px}
    .lesson{
      width:100%;min-height:66px;border:0;border-radius:12px;padding:10px;
      display:grid;grid-template-columns:44px 1fr;gap:11px;align-items:center;
      color:#fff;background:rgba(255,255,255,.045);text-align:left;margin-bottom:7px;
    }
    .lesson:active{background:rgba(255,255,255,.09)}
    .lesson.active{background:rgba(255,255,255,.1)}
    .thumb{
      width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
      background:linear-gradient(135deg,#137f83,#a8173b);font-weight:800;
    }
    .lesson-title{
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
      font-size:14px;font-weight:650;line-height:1.2;
    }
    .lesson-meta{margin-top:4px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .state{height:100%;display:grid;place-items:center;padding:32px;text-align:center;color:#fff}
    .state h1{font-size:20px;margin:0 0 6px}
    .state p{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
<main class="app" id="app" aria-label="CyberMentorTok">
  <video id="ambient" class="ambient" playsinline muted loop preload="metadata"></video>
  <section id="feed" class="feed" aria-label="Video feed"></section>

  <header class="topbar">
    <button id="countBtn" class="count" type="button" aria-label="Open lessons">0/0</button>
    <nav class="tabs" aria-label="Feed selection">
      <button class="tab" type="button" aria-label="Following">Following</button>
      <button class="tab active" type="button" aria-label="For You">For You</button>
    </nav>
    <button id="searchBtn" class="iconbtn" type="button" aria-label="Search lessons">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.7-3.7"/></svg>
    </button>
  </header>

  <div id="soundGate" class="sound-gate">Tap video for sound</div>

  <footer class="bottomnav">
    <button class="nav-item active" type="button" aria-label="Home">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg><small>Home</small>
    </button>
    <button id="navSearchBtn" class="nav-item" type="button" aria-label="Search">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.7-3.7"/></svg><small>Search</small>
    </button>
    <button id="createBtn" class="create" type="button" aria-label="Open lesson library">+</button>
    <button class="nav-item" type="button" aria-label="Progress">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg><small>Progress</small>
    </button>
    <button class="nav-item" type="button" aria-label="Profile">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><small>Profile</small>
    </button>
  </footer>

  <button id="backdrop" class="sheet-backdrop" type="button" aria-label="Close lesson library"></button>
  <aside id="sheet" class="sheet" aria-label="Lesson library">
    <div>
      <div class="grabber"></div>
      <div class="sheet-head">
        <div><strong>Lessons</strong><small id="libraryCount">0 videos</small></div>
        <button id="closeBtn" class="close" type="button" aria-label="Close">&times;</button>
      </div>
    </div>
    <label class="searchbox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.7-3.7"/></svg>
      <input id="searchInput" type="search" placeholder="Search lessons or topics" autocomplete="off" autocapitalize="none">
    </label>
    <div id="lessonList" class="list"></div>
  </aside>
</main>
<script>
(() => {
  "use strict";

  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const MANIFEST_URL = "videos.json";

  const app = document.getElementById("app");
  const feed = document.getElementById("feed");
  const ambient = document.getElementById("ambient");
  const countBtn = document.getElementById("countBtn");
  const searchBtn = document.getElementById("searchBtn");
  const navSearchBtn = document.getElementById("navSearchBtn");
  const createBtn = document.getElementById("createBtn");
  const soundGate = document.getElementById("soundGate");
  const backdrop = document.getElementById("backdrop");
  const sheet = document.getElementById("sheet");
  const closeBtn = document.getElementById("closeBtn");
  const searchInput = document.getElementById("searchInput");
  const libraryCount = document.getElementById("libraryCount");
  const lessonList = document.getElementById("lessonList");

  let videos = [];
  let filtered = [];
  let slides = [];
  let activeIndex = 0;
  let observer = null;
  let userUnlockedAudio = !IS_IOS;
  let paused = false;
  let scrollTimer = 0;
  let ambientSrc = "";

  const absoluteUrl = (src) => {
    if (!src) return "";
    try { return new URL(src, location.href).href; } catch { return src; }
  };

  const escapeHtml = (value) => String(value ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");

  const titleFor = (v) => v.title || v.id || "Lesson";
  const conceptFor = (v) => v.concept || v.category || "cybersecurity";
  const captionFor = (v) => v.hook || v.summary || v.description || v.explanation || titleFor(v);
  const difficultyFor = (v) => {
    const n = Number(v.difficulty || 1);
    return ["Beginner","Elementary","Intermediate","Advanced","Expert","Master"][Math.max(0, Math.min(5, n - 1))];
  };

  function setAppHeight() {
    const h = window.visualViewport?.height || window.innerHeight;
    document.documentElement.style.setProperty("--app-height", `${Math.round(h)}px`);
  }

  function onViewportChange() {
    const before = feed.clientHeight || 1;
    setAppHeight();
    requestAnimationFrame(() => {
      const after = feed.clientHeight || 1;
      if (Math.abs(after - before) > 2 && slides[activeIndex]) {
        feed.scrollTop = activeIndex * after;
      }
    });
  }

  setAppHeight();
  window.addEventListener("resize", onViewportChange, { passive:true });
  window.visualViewport?.addEventListener("resize", onViewportChange, { passive:true });
  window.visualViewport?.addEventListener("scroll", setAppHeight, { passive:true });

  function normalizeVideos(items) {
    const list = Array.isArray(items) ? items.filter(Boolean) : [];
    if (IS_IOS) return list.filter(v => v.full_url || (v.mask_url && v.audio_url));
    return list.filter(v => v.full_url || v.mask_url);
  }

  function chooseBackground(v) {
    const opts = Array.isArray(v?.background_options) ? v.background_options.filter(Boolean) : [];
    return v?.background_url || opts[0] || "";
  }

  function setAmbient(v) {
    const src = absoluteUrl(chooseBackground(v));
    if (!src || src === ambientSrc) return;
    ambientSrc = src;
    ambient.src = src;
    ambient.load();
    ambient.play().catch(() => {});
  }

  function createVideo(src, { muted=true, loop=true, className="media" }={}) {
    const el = document.createElement("video");
    el.className = className;
    el.playsInline = true;
    el.setAttribute("playsinline","");
    el.setAttribute("webkit-playsinline","");
    el.muted = muted;
    el.defaultMuted = muted;
    el.loop = loop;
    el.preload = "metadata";
    el.controls = false;
    el.disablePictureInPicture = true;
    el.dataset.src = absoluteUrl(src);
    return el;
  }

  function icon(kind) {
    const icons = {
      heart:'<svg width="31" height="31" viewBox="0 0 24 24" fill="white"><path d="M12 21s-7.2-4.35-9.55-8.6C.62 9.1 2.2 5 6.3 5c2.05 0 3.35 1.1 4.2 2.2C11.35 6.1 12.65 5 14.7 5c4.1 0 5.68 4.1 3.85 7.4C16.2 16.65 12 21 12 21z"/></svg>',
      comment:'<svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M4 4h16v12H9l-5 4V4z"/></svg>',
      save:'<svg width="29" height="29" viewBox="0 0 24 24" fill="white"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>',
      share:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 13v7h14v-7"/></svg>',
      play:'<svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>'
    };
    return icons[kind] || "";
  }

  function renderSlide(v, index) {
    const slide = document.createElement("article");
    slide.className = "slide";
    slide.dataset.index = String(index);
    slide.dataset.hydrated = "0";
    slide._players = [];

    const useFull = !!v.full_url && (IS_IOS || !v.mask_url || !v.audio_url);
    if (useFull) {
      const full = createVideo(v.full_url, { muted:!userUnlockedAudio, loop:true, className:"media full" });
      slide._players.push(full);
      slide._primary = full;
      slide.appendChild(full);
      slide.dataset.kind = "full";
    } else if (v.mask_url) {
      const mask = createVideo(v.mask_url, { muted:true, loop:true, className:"media" });
      slide._players.push(mask);
      slide.appendChild(mask);
      if (v.audio_url) {
        const audio = document.createElement("audio");
        audio.preload = "metadata";
        audio.dataset.src = absoluteUrl(v.audio_url);
        slide._players.push(audio);
        slide._audio = audio;
        slide._mask = mask;
      }
      slide.dataset.kind = "mask";
    }

    slide.insertAdjacentHTML("beforeend", `
      <div class="scrim-top"></div><div class="scrim-bottom"></div>
      <section class="caption">
        <div class="handle">@${escapeHtml(conceptFor(v))}</div>
        <p class="copy">${escapeHtml(captionFor(v))}</p>
        <div class="meta"><span class="pill">♪ ${escapeHtml(difficultyFor(v))}</span></div>
      </section>
      <aside class="rail">
        <div class="avatar">${escapeHtml(String(v.difficulty || "C"))}</div>
        <button class="rail-btn" type="button" aria-label="Like">${icon("heart")}<span>Like</span></button>
        <button class="rail-btn" type="button" aria-label="Comments">${icon("comment")}<span>Learn</span></button>
        <button class="rail-btn" type="button" aria-label="Save">${icon("save")}<span>Save</span></button>
        <button class="rail-btn share" type="button" aria-label="Share">${icon("share")}<span>Share</span></button>
        <div class="disc"></div>
      </aside>
      <div class="pause-toast">${icon("play")}</div>
    `);

    slide.querySelector(".share").addEventListener("click", async (e) => {
      e.stopPropagation();
      const payload = { title:titleFor(v), text:captionFor(v), url:location.href };
      try {
        if (navigator.share) await navigator.share(payload);
        else await navigator.clipboard.writeText(location.href);
      } catch {}
    });

    slide.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      if (!userUnlockedAudio) {
        userUnlockedAudio = true;
        soundGate.classList.remove("show");
        syncAudioPolicy();
        playActive();
        return;
      }
      paused ? resume() : pause();
    });

    return slide;
  }

  function hydrate(slide) {
    if (!slide || slide.dataset.hydrated === "1") return;
    slide._players.forEach(p => {
      if (!p.dataset.src || p.src) return;
      p.src = p.dataset.src;
      if (p.tagName === "VIDEO") p.load();
    });
    slide.dataset.hydrated = "1";
  }

  function hydrateAround(index) {
    for (let i=index-1;i<=index+1;i++) hydrate(slides[i]);
  }

  function syncAudioPolicy() {
    slides.forEach(slide => {
      if (slide._primary) {
        slide._primary.muted = !userUnlockedAudio;
        slide._primary.defaultMuted = !userUnlockedAudio;
      }
    });
  }

  function syncMaskAudio(slide) {
    if (!slide?._mask || !slide?._audio) return;
    const drift = Math.abs((slide._mask.currentTime || 0) - (slide._audio.currentTime || 0));
    if (drift > .18) {
      try { slide._audio.currentTime = slide._mask.currentTime; } catch {}
    }
  }

  function stopSlide(slide, reset=true) {
    if (!slide) return;
    slide._players.forEach(p => {
      p.pause();
      if (reset) { try { p.currentTime = 0; } catch {} }
    });
  }

  function playSlide(slide) {
    if (!slide || paused) return;
    hydrate(slide);
    if (slide._primary) {
      slide._primary.muted = !userUnlockedAudio;
      slide._primary.play().catch(() => {
        slide._primary.muted = true;
        slide._primary.play().catch(() => {});
        if (!userUnlockedAudio) soundGate.classList.add("show");
      });
      return;
    }
    if (slide._mask) {
      slide._mask.play().catch(() => {});
      if (slide._audio && userUnlockedAudio) {
        syncMaskAudio(slide);
        slide._audio.play().catch(() => {});
      }
    }
  }

  function playActive() {
    ambient.play().catch(() => {});
    playSlide(slides[activeIndex]);
  }

  function setActive(index) {
    if (!slides.length) return;
    index = Math.max(0, Math.min(slides.length - 1, index));
    if (index !== activeIndex) stopSlide(slides[activeIndex], true);
    activeIndex = index;
    hydrateAround(index);
    setAmbient(videos[index]);
    slides.forEach((s,i) => {
      if (i !== index) stopSlide(s, true);
      s.classList.toggle("paused", i === index && paused);
    });
    if (!paused) playSlide(slides[index]);
    countBtn.textContent = `${index + 1}/${videos.length}`;
    renderLibrarySelection();
  }

  function pause() {
    paused = true;
    ambient.pause();
    stopSlide(slides[activeIndex], false);
    slides[activeIndex]?.classList.add("paused");
  }

  function resume() {
    paused = false;
    slides[activeIndex]?.classList.remove("paused");
    playActive();
  }

  function renderFeed() {
    feed.innerHTML = "";
    if (!videos.length) {
      feed.innerHTML = '<section class="state"><div><h1>No videos found</h1><p>Add lessons to videos.json and keep the referenced media available locally.</p></div></section>';
      return;
    }
    const frag = document.createDocumentFragment();
    slides = videos.map((v,i) => {
      const s = renderSlide(v,i);
      frag.appendChild(s);
      return s;
    });
    feed.appendChild(frag);
    observeSlides();
    setActive(0);
    renderLibrary();
    if (IS_IOS && !userUnlockedAudio) soundGate.classList.add("show");
  }

  function observeSlides() {
    observer?.disconnect();
    observer = new IntersectionObserver(entries => {
      const candidate = entries
        .filter(e => e.isIntersecting && e.intersectionRatio >= .55)
        .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (candidate) setActive(Number(candidate.target.dataset.index));
    }, { root:feed, threshold:[.55,.72,.9] });
    slides.forEach(s => observer.observe(s));
  }

  function searchable(v) {
    return [v.id,v.title,v.hook,v.summary,v.description,v.concept,v.category,v.concept_id,difficultyFor(v)]
      .filter(Boolean).join(" ").toLowerCase();
  }

  function renderLibrary() {
    const q = searchInput.value.trim().toLowerCase();
    filtered = q ? videos.filter(v => searchable(v).includes(q)) : [...videos];
    libraryCount.textContent = `${filtered.length} of ${videos.length} videos`;
    lessonList.innerHTML = "";
    const frag = document.createDocumentFragment();
    filtered.forEach(v => {
      const index = videos.indexOf(v);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `lesson${index === activeIndex ? " active" : ""}`;
      btn.dataset.index = String(index);
      btn.innerHTML = `
        <span class="thumb">${index + 1}</span>
        <span><span class="lesson-title">${escapeHtml(titleFor(v))}</span>
        <span class="lesson-meta">${escapeHtml(conceptFor(v))} · ${escapeHtml(difficultyFor(v))}</span></span>`;
      btn.addEventListener("click", () => {
        closeSheet();
        requestAnimationFrame(() => {
          const h = feed.clientHeight || 1;
          feed.scrollTo({ top:index*h, behavior:"smooth" });
          setActive(index);
        });
      });
      frag.appendChild(btn);
    });
    lessonList.appendChild(frag);
  }

  function renderLibrarySelection() {
    lessonList.querySelectorAll(".lesson").forEach(el => {
      el.classList.toggle("active", Number(el.dataset.index) === activeIndex);
    });
  }

  function openSheet(focus=false) {
    sheet.classList.add("open");
    backdrop.classList.add("open");
    if (focus) setTimeout(() => searchInput.focus(), 180);
  }

  function closeSheet() {
    sheet.classList.remove("open");
    backdrop.classList.remove("open");
    searchInput.blur();
  }

  countBtn.addEventListener("click", () => openSheet(false));
  createBtn.addEventListener("click", () => openSheet(false));
  searchBtn.addEventListener("click", () => openSheet(true));
  navSearchBtn.addEventListener("click", () => openSheet(true));
  backdrop.addEventListener("click", closeSheet);
  closeBtn.addEventListener("click", closeSheet);
  searchInput.addEventListener("input", renderLibrary);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      ambient.pause();
      stopSlide(slides[activeIndex], false);
    } else if (!paused) {
      playActive();
    }
  });

  feed.addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const h = feed.clientHeight || 1;
      const index = Math.round(feed.scrollTop / h);
      if (index !== activeIndex) setActive(index);
    }, 90);
  }, { passive:true });

  async function load() {
    feed.innerHTML = '<section class="state"><div><h1>Loading lessons</h1><p>Preparing your feed…</p></div></section>';
    const response = await fetch(`${MANIFEST_URL}?v=${Date.now()}`, { cache:"no-store" });
    if (!response.ok) throw new Error(`videos.json returned HTTP ${response.status}`);
    videos = normalizeVideos(await response.json());
    renderFeed();
  }

  load().catch(err => {
    feed.innerHTML = `<section class="state"><div><h1>Could not load lessons</h1><p>${escapeHtml(err.message)}</p></div></section>`;
  });
})();
</script>
</body>
</html>
