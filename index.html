escription": "A deeper lesson on tenant isolation in compute, data, policy, observability, and noisy-neighbor control.", "problem": "Shared platforms often isolate at one layer only, leaving metadata, performance, privileges, or operational tooling cross-tenant in risky ways.", "explanation": "Real tenant isolation spans identity, data paths, encryption context, quotas, logging visibility, and incident blast radius. Experts choose isolation depth according to threat model, compliance needs, and economics rather than using one tenancy pattern everywhere. Some systems can share infrastructure safely; others need stronger segmentation or dedicated trust anchors. The hard part is aligning isolation with both attack paths and operational paths.", "summary": "Tenant isolation must cover both security reach and operational reach, not just database rows.", "lesson_id": "gha-048", "concept_id": "multi-tenant-isolation", "concept": "multi-tenant-isolation", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/d91ed72a/mask.webm", "audio_url": "video_pipeline/output/d91ed72a/audio.mp3", "full_url": "video_pipeline/output/d91ed72a/full.mp4", "timing_url": "video_pipeline/output/d91ed72a/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789734.8960638, "size_bytes": 17570989, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "d91ed72a"}, {"id": "gha-047", "title": "Observability for Distributed Systems: Correlating Cause Across Boundaries", "hook": "In distributed systems, a log line without context is often just a rumor.", "description": "A lesson on traces, structured logs, metrics, correlation IDs, and what evidence architectures need during incidents.", "problem": "Teams collect plenty of telemetry but cannot reconstruct request paths, decision points, or causality when failures span multiple services.", "explanation": "Distributed observability requires shared identifiers, consistent event structure, trustworthy clocks, and coverage at the boundaries where decisions occur. Experts do not only instrument code paths; they instrument queue delays, retry causes, authorization decisions, configuration changes, and control-plane actions. The goal is not more data but faster causal explanation. Architecture that cannot explain itself under stress is hard to operate safely.", "summary": "Observability should let you answer why something happened across services, not merely prove that many components were noisy.", "lesson_id": "gha-047", "concept_id": "distributed-observability", "concept": "distributed-observability", "category": "availability", "difficulty": 4, "mask_url": "video_pipeline/output/d0af26de/mask.webm", "audio_url": "video_pipeline/output/d0af26de/audio.mp3", "full_url": null, "timing_url": "video_pipeline/output/d0af26de/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789733.8960638, "size_bytes": 2412405, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "d0af26de"}, {"id": "gha-046", "title": "Retry Storms and Exponential Backoff With Jitter", "hook": "Retries heal transient faults right up until they become the dominant source of load.", "description": "How retries interact with timeouts, circuit breakers, and overload, plus why backoff and jitter are architectural necessities.", "problem": "When many clients retry at once, a recovering dependency can be pushed straight back into failure by the rescue mechanism itself.", "explanation": "A retry is a bet that waiting a bit improves odds of success. That bet becomes dangerous when many clients make it simultaneously against the same stressed dependency. Experts bound retries tightly, apply exponential backoff with jitter, and classify which operations are safe to retry at all. Retry design belongs to system architecture because it changes fleet-wide load shape during incidents.", "summary": "Retries need discipline. Without backoff, jitter, and safety rules, they turn local failure into platform-wide pressure.", "lesson_id": "gha-046", "concept_id": "retry-storms", "concept": "retry-storms", "category": "stability", "difficulty": 4, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789732.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-045", "title": "Failure Domains: Zones, Regions, and Shared Control Planes", "hook": "Two replicas are not independent if one invisible dependency can still drop them together.", "description": "A focused lesson on identifying real failure domains across compute, storage, networking, identity, deployment, and control planes.", "problem": "Architectures claim multi-zone or multi-region resilience while still relying on shared services whose failure can negate the redundancy instantly.", "explanation": "Failure domains are the boundaries within which a fault can spread through shared fate. Experts analyze not just workload placement but also DNS, CI/CD, secrets, observability backends, identity providers, and human operational coupling. A system is only as independent as its most silently shared dependency. Availability planning gets more realistic the moment these hidden common points are mapped and challenged.", "summary": "Redundancy without failure-domain analysis is optimism wearing architecture clothing.", "lesson_id": "gha-045", "concept_id": "failure-domains", "concept": "failure-domains", "category": "availability", "difficulty": 5, "mask_url": "video_pipeline/output/e570ed21/mask.webm", "audio_url": "video_pipeline/output/e570ed21/audio.mp3", "full_url": "video_pipeline/output/e570ed21/full.mp4", "timing_url": "video_pipeline/output/e570ed21/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789731.8960638, "size_bytes": 17034224, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "e570ed21"}, {"id": "gha-044", "title": "Rate Limiting Algorithms: Token Buckets, Sliding Windows, and Fairness", "hook": "All rate limits are policies, but not all rate-limit algorithms fail the same way.", "description": "A deeper lesson on fixed windows, sliding windows, token buckets, leaky buckets, burst tolerance, and distributed enforcement tradeoffs.", "problem": "Teams say they have rate limiting but do not understand the fairness, burst behavior, or synchronization cost of the chosen algorithm.", "explanation": "Each algorithm expresses a different philosophy of control. Fixed windows are simple but can create boundary bursts; sliding windows are fairer but costlier; token buckets allow controlled bursts; leaky buckets smooth output aggressively. Experts choose based on the threat model, user experience, and infrastructure topology, especially when enforcing limits across many instances with shared state. The algorithm is part of the product contract, not just an implementation detail.", "summary": "Choose a rate-limit algorithm for the behavior you want under pressure, not only for coding convenience.", "lesson_id": "gha-044", "concept_id": "rate-limit-algorithms", "concept": "rate-limit-algorithms", "category": "stability", "difficulty": 4, "mask_url": "video_pipeline/output/ace9ad25/mask.webm", "audio_url": "video_pipeline/output/ace9ad25/audio.mp3", "full_url": "video_pipeline/output/ace9ad25/full.mp4", "timing_url": "video_pipeline/output/ace9ad25/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789730.8960638, "size_bytes": 16311657, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "ace9ad25"}, {"id": "gha-043", "title": "Idempotency and Replay Safety in Distributed APIs", "hook": "Retries are healthy only when repeated intent does not create repeated damage.", "description": "A focused lesson on idempotency keys, replay windows, deduplication stores, and safe retry semantics for external and internal APIs.", "problem": "Clients retry on timeouts, networks duplicate sends, and jobs replay after crashes, but many APIs still treat every arrival like a brand-new instruction.", "explanation": "Idempotency means the system can recognize duplicate intent and avoid applying the same side effect twice. Experts define operation scope carefully because some actions are naturally idempotent while others require explicit keys, dedupe records, or workflow state machines. Replay safety also intersects with fraud, authorization freshness, and compensating actions when duplicates arrive after partial completion. Good API architecture assumes retries will happen and makes them safe by design.", "summary": "A distributed API should expect retries and duplicates. Idempotency is what turns that expectation into correctness.", "lesson_id": "gha-043", "concept_id": "idempotency", "concept": "idempotency", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/80670ebc/mask.webm", "audio_url": "video_pipeline/output/80670ebc/audio.mp3", "full_url": "video_pipeline/output/80670ebc/full.mp4", "timing_url": "video_pipeline/output/80670ebc/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789729.8960638, "size_bytes": 16898995, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "80670ebc"}, {"id": "gha-042", "title": "Outbox Pattern: Reliable Event Publishing Without Dual Writes", "hook": "State change plus event emission looks simple until one succeeds and the other does not.", "description": "A deeper lesson on transactional outbox, delivery guarantees, replay safety, and eventual consistency workflows.", "problem": "Without an outbox or equivalent pattern, systems update local state and publish events separately, creating silent divergence after partial failure.", "explanation": "The outbox pattern records the intended message inside the same local transaction as the state change, then publishes asynchronously from durable storage. Experts combine it with idempotent consumers, ordering assumptions, and poison-message handling so reliability remains practical at scale. It does not create magic exactly-once semantics across the world, but it collapses one dangerous failure mode: state changed with no durable publication intent. This makes distributed workflows far more repairable.", "summary": "Outbox patterns turn dual-write fragility into explicit, recoverable event publication flow.", "lesson_id": "gha-042", "concept_id": "outbox-pattern", "concept": "outbox-pattern", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/6eb6d932/mask.webm", "audio_url": "video_pipeline/output/6eb6d932/audio.mp3", "full_url": "video_pipeline/output/6eb6d932/full.mp4", "timing_url": "video_pipeline/output/6eb6d932/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789728.8960638, "size_bytes": 16834085, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "6eb6d932"}, {"id": "gha-041", "title": "Service Discovery and Registration Churn", "hook": "In dynamic systems, finding the right instance safely becomes part of the reliability problem.", "description": "A subtopic lesson on discovery correctness, stale registrations, TTLs, health semantics, and coordination with load balancing.", "problem": "Autoscaled systems create rapid instance churn, and stale discovery data can route traffic to dead or not-yet-ready workloads.", "explanation": "Service discovery must answer three questions well: what instances exist, which are healthy enough for traffic, and how quickly routing state converges after change. Experts pay close attention to registration TTLs, readiness gates, connection draining, and cache staleness between control and data planes. Discovery failures often look like random flakiness when they are actually timing bugs in how endpoint truth propagates. Discovery quality is therefore part of core service reliability.", "summary": "Dynamic fleets require trustworthy instance truth. Bad discovery turns elasticity into intermittent failure.", "lesson_id": "gha-041", "concept_id": "service-discovery", "concept": "service-discovery", "category": "scalability", "difficulty": 4, "mask_url": "video_pipeline/output/6eb6d932/mask.webm", "audio_url": "video_pipeline/output/6eb6d932/audio.mp3", "full_url": "video_pipeline/output/6eb6d932/full.mp4", "timing_url": "video_pipeline/output/6eb6d932/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789727.8960638, "size_bytes": 16834085, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "6eb6d932"}, {"id": "gha-040", "title": "Container Image Trust: Provenance, Signing, and Runtime Consequences", "hook": "If you cannot trust what image entered the cluster, every later runtime control starts from a compromised premise.", "description": "A focused lesson on image provenance, supply chain trust, signature verification, and runtime drift assumptions.", "problem": "Teams scan images for vulnerabilities but do not prove who built them, whether they were tampered with, or whether runtime state still matches the artifact they approved.", "explanation": "Image trust spans build identity, dependency provenance, signing, registry controls, and admission policy. Experts distinguish vulnerability status from artifact authenticity because a clean image can still be malicious or replaced. Runtime enforcement matters too, since mutable state, side-loaded binaries, or unmanaged debug access can drift away from the approved artifact. Secure container architecture starts with trusted artifact lineage.", "summary": "Scanning is not provenance. Know who built the image, what exactly was shipped, and whether runtime still matches that claim.", "lesson_id": "gha-040", "concept_id": "image-trust", "concept": "image-trust", "category": "scalability", "difficulty": 4, "mask_url": "video_pipeline/output/971a67b8/mask.webm", "audio_url": "video_pipeline/output/971a67b8/audio.mp3", "full_url": "video_pipeline/output/971a67b8/full.mp4", "timing_url": "video_pipeline/output/971a67b8/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789726.8960638, "size_bytes": 15770629, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "971a67b8"}, {"id": "gha-039", "title": "Canary and Progressive Delivery as Reliability Controls", "hook": "A deployment strategy is also a risk strategy.", "description": "A lesson on canaries, phased rollout, blast-radius control, rollback triggers, and metrics-informed delivery.", "problem": "Teams ship broadly because deployment is fast, then discover bad releases only after the entire user base is already exposed.", "explanation": "Progressive delivery limits exposure by introducing change to small slices first and evaluating health before expansion. Experts choose slice boundaries carefully: by region, tenant, cohort, or feature path. They also define kill criteria up front so rollback is a preplanned control, not a debate during incident pressure. Progressive delivery reduces both software risk and security policy rollout risk when used rigorously.", "summary": "Release gradually so architecture can detect bad change before the whole platform absorbs it.", "lesson_id": "gha-039", "concept_id": "progressive-delivery", "concept": "progressive-delivery", "category": "scalability", "difficulty": 4, "mask_url": "video_pipeline/output/8c06f258/mask.webm", "audio_url": "video_pipeline/output/8c06f258/audio.mp3", "full_url": "video_pipeline/output/8c06f258/full.mp4", "timing_url": "video_pipeline/output/8c06f258/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789725.8960638, "size_bytes": 17202527, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "8c06f258"}, {"id": "gha-038", "title": "Backpressure and Admission Control: Refusing Work to Stay Alive", "hook": "Healthy systems do not accept every request. They protect themselves by deciding which work is worth admitting.", "description": "An expert lesson on load shedding, queue discipline, concurrency limits, and upstream signaling under overload.", "problem": "Systems often keep accepting requests after the point where useful work can complete, turning overload into queue inflation and total collapse.", "explanation": "Backpressure is the mechanism by which a system tells callers or upstream stages that it cannot safely absorb more work. Expert designs combine queue bounds, concurrency guards, priority classes, and fast-fail semantics so overload becomes visible early instead of diffusing silently. Admission control is especially important for protecting scarce resources like database pools or cryptographic engines. Declining work deliberately can preserve the service's most important outcomes.", "summary": "Stability sometimes means saying no fast enough to keep the core alive.", "lesson_id": "gha-038", "concept_id": "backpressure", "concept": "backpressure", "category": "stability", "difficulty": 5, "mask_url": "video_pipeline/output/ace9ad25/mask.webm", "audio_url": "video_pipeline/output/ace9ad25/audio.mp3", "full_url": "video_pipeline/output/ace9ad25/full.mp4", "timing_url": "video_pipeline/output/ace9ad25/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789724.8960638, "size_bytes": 16311657, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "ace9ad25"}, {"id": "gha-037", "title": "Bulkheads: Resource Isolation for Shared Platforms", "hook": "Shared resources become outage multipliers unless the architecture divides them before failure does.", "description": "A subtopic lesson on resource pool isolation across threads, queues, connections, tenants, and dependencies.", "problem": "One failing integration or noisy tenant can consume shared pools and starve healthy work across the rest of the platform.", "explanation": "Bulkheads separate resources so failure or saturation in one path cannot monopolize everything. Experts apply them to worker pools, database connections, tenant quotas, retry budgets, and network classes. Isolation is not free because it can reduce aggregate efficiency, but it buys predictability under stress. Stability usually prefers bounded waste over unbounded contention.", "summary": "If everything shares one pool, one bad path can own the platform. Bulkheads turn shared chaos into local pain.", "lesson_id": "gha-037", "concept_id": "bulkheads", "concept": "bulkheads", "category": "stability", "difficulty": 4, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789723.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-036", "title": "Graceful Degradation: Deciding What Must Survive First", "hook": "Degradation is not failure avoidance. It is prioritization under loss.", "description": "How to preserve core service value while dropping optional features, enrichments, or expensive paths under stress.", "problem": "Many systems either stay fully on until they collapse or disable features randomly because no one defined core versus optional service behavior.", "explanation": "Graceful degradation begins with product and security priorities: what outcomes must survive, what may be delayed, and what can fail closed. Expert designs isolate non-critical dependencies, precompute fallbacks, and ensure degraded paths do not quietly bypass policy or expose stale sensitive data. Good degradation is explicit, observable, and reversible. It preserves business value without pretending normal operation still exists.", "summary": "Plan degraded mode intentionally. The system should know what to save first when conditions turn bad.", "lesson_id": "gha-036", "concept_id": "graceful-degradation", "concept": "graceful-degradation", "category": "availability", "difficulty": 4, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789722.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-035", "title": "Health Checks: Liveness, Readiness, and the Lies Systems Tell", "hook": "A service can be alive, accepting connections, and still be effectively down for users.", "description": "A focused lesson on health check design for routing, failover, autoscaling, and safe operational decisions.", "problem": "Shallow health probes keep routing traffic to services that are technically up but functionally broken, overloaded, or unable to reach dependencies.", "explanation": "Liveness answers whether the process should be restarted; readiness answers whether the service should receive traffic. Expert health models often include dependency awareness, resource saturation, and critical-path validation without becoming so deep that probes become self-inflicted load. The real challenge is preventing control planes from making harmful decisions based on misleading green signals. Health checks are architecture because they directly influence routing and recovery behavior.", "summary": "A green health signal is useful only if it predicts whether the service can still honor its contract.", "lesson_id": "gha-035", "concept_id": "health-checks", "concept": "health-checks", "category": "availability", "difficulty": 4, "mask_url": "video_pipeline/output/e570ed21/mask.webm", "audio_url": "video_pipeline/output/e570ed21/audio.mp3", "full_url": "video_pipeline/output/e570ed21/full.mp4", "timing_url": "video_pipeline/output/e570ed21/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789721.8960638, "size_bytes": 17034224, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "e570ed21"}, {"id": "gha-034", "title": "Cache Invalidation and Revocation Safety", "hook": "Cache invalidation is hard because it is really a distributed truth problem.", "description": "A deeper lesson on invalidation authority, revocation-sensitive data, TTL strategy, and stale-read risk.", "problem": "Caches improve performance until they serve data that should have been revoked, updated, or denied immediately.", "explanation": "Invalidation design must define who can declare cached state obsolete, how quickly that decision propagates, and what happens if propagation lags. Security-relevant state such as authorization, entitlements, fraud flags, or account disablement often cannot tolerate weak freshness guarantees. Experts separate revocation-critical state from safely cacheable state and design invalidation paths that survive dependency failure. Otherwise the cache becomes an integrity hazard, not merely a performance layer.", "summary": "Not all state is equally cacheable. Revocation-sensitive decisions need stronger freshness semantics.", "lesson_id": "gha-034", "concept_id": "cache-invalidation", "concept": "cache-invalidation", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/ace9ad25/mask.webm", "audio_url": "video_pipeline/output/ace9ad25/audio.mp3", "full_url": "video_pipeline/output/ace9ad25/full.mp4", "timing_url": "video_pipeline/output/ace9ad25/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789720.8960638, "size_bytes": 16311657, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "ace9ad25"}, {"id": "gha-033", "title": "Tail Latency Amplification: Why Parallelism Can Make UX Worse", "hook": "Every extra dependency multiplies the chance that one slow call becomes the user's entire experience.", "description": "A subtopic lesson on p95 and p99 latency amplification in fan-out request paths and distributed architectures.", "problem": "Engineers celebrate parallel requests for average performance while ignoring that any one slow branch can dominate end-to-end latency.", "explanation": "Tail latency amplification happens when a request depends on many sub-requests and completion is gated by the slowest path. Expert designs minimize unnecessary fan-out, isolate optional enrichments, and establish request budgets so low-value work cannot consume the entire latency envelope. Queueing effects and retries worsen the problem because they create secondary slowness across shared dependencies. Tail work should be treated as a first-class design risk.", "summary": "Parallelism lowers averages but can worsen tails. Design for the slowest branch, not the happiest median.", "lesson_id": "gha-033", "concept_id": "tail-latency-amplification", "concept": "tail-latency-amplification", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/a64d9600/mask.webm", "audio_url": "video_pipeline/output/a64d9600/audio.mp3", "full_url": "video_pipeline/output/a64d9600/full.mp4", "timing_url": "video_pipeline/output/a64d9600/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789719.8960638, "size_bytes": 22708219, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "a64d9600"}, {"id": "gha-032", "title": "Blast Radius Design: Containing Failure and Compromise by Structure", "hook": "Security architecture is often the art of making sure one bad decision stays local.", "description": "How to deliberately limit compromise scope through tenancy boundaries, privilege scoping, segmentation, and compartmentalization.", "problem": "Systems fail catastrophically when one credential, one host, or one workload inherits broad lateral reach by default.", "explanation": "Blast-radius design constrains what any single failure or compromise can influence. Experts apply it through per-service identities, segmented network paths, scoped keys, isolated runtime classes, independent deployment rings, and data partitioning. The point is not merely segmentation on paper but reduction of effective reach under realistic attacker behavior and operational mistakes. Every privileged path should be challenged with the question: if this is lost, how much truly falls with it?", "summary": "Do not only protect assets. Architect so that losing one control does not lose the whole system.", "lesson_id": "gha-032", "concept_id": "blast-radius", "concept": "blast-radius", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789718.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-031", "title": "Trust Boundaries: Where Security Architecture Actually Begins", "hook": "Most major architecture mistakes begin with one wrong trust assumption.", "description": "A focused lesson on identifying trust boundaries between users, workloads, platforms, networks, and operators.", "problem": "Teams draw system diagrams by component type, not by trust transitions, so identity and policy enforcement land in the wrong places.", "explanation": "A trust boundary is the line where assumptions about identity, integrity, confidentiality, or control authority must change. Expert architecture maps which actor controls credentials, code execution, policy, telemetry, and data movement at every hop. These boundaries often matter more than network segments because they determine where verification must happen and where compromise can spread. If trust is implicit across a boundary, the system is probably overexposed.", "summary": "Find the trust boundaries first. They tell you where verification, isolation, and policy actually belong.", "lesson_id": "gha-031", "concept_id": "trust-boundaries", "concept": "trust-boundaries", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/a1233aa9/mask.webm", "audio_url": "video_pipeline/output/a1233aa9/audio.mp3", "full_url": "video_pipeline/output/a1233aa9/full.mp4", "timing_url": "video_pipeline/output/a1233aa9/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789717.8960638, "size_bytes": 15808994, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "a1233aa9"}, {"id": "gha-030", "title": "Lessons in Resilience: What Stable Systems Actually Practice", "hook": "Resilient systems are rarely built from one pattern. They emerge from many small discipline choices that keep bad conditions from becoming systemic failure.", "description": "A synthesis lesson tying together timeouts, retries, circuit breakers, load shedding, observability, and operational rehearsal.", "problem": "Teams memorize resilience vocabulary but never connect the patterns into one operating model, so controls conflict or fail under the same incident.", "explanation": "Real resilience practice combines several layers: timeouts to stop indefinite waiting, retries only where they are safe, breakers to bound failure spread, bulkheads to isolate resources, observability to reveal degradation, and rehearsals to validate human response. Experts also watch for interaction bugs, such as retries that defeat load shedding or fallback paths that create stale security decisions. Stability is a system of patterns, not a single checkbox.", "summary": "Resilience is compositional. The architecture is stable only when the patterns reinforce each other under pressure.", "lesson_id": "gha-030", "concept_id": "resilience-lessons", "concept": "resilience-lessons", "category": "stability", "difficulty": 4, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789716.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-029", "title": "Gateway Stability: Applying Circuit Breaking at Shared Ingress Points", "hook": "A shared gateway can protect the platform or become the place where platform-wide instability starts.", "description": "An expert lesson on using circuit-breaking ideas at gateways and channel layers: overload shielding, dependency isolation, and policy-aware degradation.", "problem": "Gateways often aggregate authentication, routing, transformation, and policy enforcement, so one weak downstream dependency can drag the entire edge into failure.", "explanation": "Applying stability patterns at gateways requires more than generic retry rules. Experts segment routes by dependency quality, apply route-specific timeouts and concurrency limits, and preserve critical paths when optional downstream enrichments fail. Shared ingress points also need strong telemetry because they are where user-facing symptoms first appear. Gateway resilience is about protecting the platform's public contract under dependency stress.", "summary": "Edge stability comes from isolating downstream failure at the gateway instead of letting it contaminate every incoming request.", "lesson_id": "gha-029", "concept_id": "gateway-stability", "concept": "gateway-stability", "category": "stability", "difficulty": 4, "mask_url": "video_pipeline/output/80670ebc/mask.webm", "audio_url": "video_pipeline/output/80670ebc/audio.mp3", "full_url": "video_pipeline/output/80670ebc/full.mp4", "timing_url": "video_pipeline/output/80670ebc/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789715.8960638, "size_bytes": 16898995, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "80670ebc"}, {"id": "gha-028", "title": "Circuit Breakers for Container Platforms: Stability in Dense, Dynamic Environments", "hook": "Container platforms increase deployment agility, but they also create dense failure surfaces where bad dependencies can spread instability quickly.", "description": "How circuit breaking applies in containerized environments with autoscaling, service discovery churn, and shared node pressure.", "problem": "In container fleets, dependency instability mixes with scheduling churn, node saturation, and rolling deploys, making naive retry behavior especially destructive.", "explanation": "Breakers in container platforms must account for dynamic endpoints, readiness transitions, short-lived instances, and mesh-level routing behavior. Experts coordinate application-level protections with platform controls such as health probes, connection pools, concurrency limits, and admission policies. Stability depends on understanding whether the failure is in the app, the node, the network fabric, or the control plane. The breaker is one part of a layered platform stability strategy.", "summary": "In containers, breakers help, but only when they are aligned with orchestration behavior and platform health semantics.", "lesson_id": "gha-028", "concept_id": "container-circuit-breakers", "concept": "container-circuit-breakers", "category": "stability", "difficulty": 4, "mask_url": "video_pipeline/output/971a67b8/mask.webm", "audio_url": "video_pipeline/output/971a67b8/audio.mp3", "full_url": "video_pipeline/output/971a67b8/full.mp4", "timing_url": "video_pipeline/output/971a67b8/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789714.8960638, "size_bytes": 15770629, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "971a67b8"}, {"id": "gha-027", "title": "Circuit Breaking in Distributed Systems: Thresholds, Telemetry, and Recovery Semantics", "hook": "In distributed systems, a circuit breaker is only as good as the telemetry and recovery assumptions behind it.", "description": "A deeper lesson on breaker tuning in heterogeneous fleets: error classification, rolling windows, partial outages, and coordinated recovery.", "problem": "A breaker that trips on the wrong signals or recovers too aggressively can oscillate, hide real problems, or create synchronized load spikes.", "explanation": "Distributed systems complicate circuit breaking because failures are not binary. One zone may degrade, one backend pool may saturate, or one request class may be uniquely expensive. Experts classify which failures count, scope breakers to the right dependency granularity, and correlate breaker state with tracing and saturation data. Recovery is part of the design: if all callers probe at once, the breaker becomes another amplifier rather than a shield.", "summary": "Breakers need precise failure signals and careful recovery behavior, or they become instability disguised as protection.", "lesson_id": "gha-027", "concept_id": "distributed-circuit-breaking", "concept": "distributed-circuit-breaking", "category": "stability", "difficulty": 5, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789713.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-026", "title": "Circuit Breaker: Failing Fast to Protect the Rest of the System", "hook": "A circuit breaker is not about hiding failure. It is about containing failure before waiting threads, retries, and queues spread it everywhere.", "description": "An expert lesson on circuit breaker states, error budgets, timeout coupling, and where circuit breakers fit among other resilience controls.", "problem": "Teams add retries without breakers, causing a dependency outage to multiply into full platform collapse through load amplification.", "explanation": "The circuit breaker monitors dependency failure and changes call behavior when thresholds are exceeded. Expert tuning is less about the pattern name and more about the thresholds, windowing, fallback strategy, and relationship to timeouts, retries, and bulkheads. A breaker should defend the caller's resources while still allowing measured recovery testing through half-open behavior. Used well, it turns cascading failure into bounded degradation.", "summary": "Circuit breakers protect system stability by refusing to spend resources on dependencies that are currently unsafe to trust.", "lesson_id": "gha-026", "concept_id": "circuit-breaker", "concept": "circuit-breaker", "category": "stability", "difficulty": 4, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789712.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-025", "title": "Global Account Architecture: Identity That Survives Geography and Scale", "hook": "Global account systems are difficult because identity data must be correct, timely, and available everywhere without becoming an unsafe replication mess.", "description": "A deep lesson on globally distributed identity and account platforms: replication, consistency, regulatory boundaries, and failure isolation.", "problem": "Teams globalize user identity without defining consistency boundaries, residency constraints, recovery rules, or how trust should propagate across regions and clouds.", "explanation": "Global account architecture has to reconcile user experience, fraud control, privacy obligations, and infrastructure reality. Experts distinguish authoritative identity sources from cached claims, design around propagation delay, and limit the blast radius of regional failure or bad policy rollout. Availability matters, but identity correctness matters just as much because bad auth state can create security incidents instantly. The design must balance local performance with globally trustworthy control.", "summary": "Global identity systems demand careful tradeoffs between consistency, latency, residency, and blast-radius control.", "lesson_id": "gha-025", "concept_id": "global-account-systems", "concept": "global-account-systems", "category": "availability", "difficulty": 5, "mask_url": "video_pipeline/output/3f16ad52/mask.webm", "audio_url": "video_pipeline/output/3f16ad52/audio.mp3", "full_url": "video_pipeline/output/3f16ad52/full.mp4", "timing_url": "video_pipeline/output/3f16ad52/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789711.8960638, "size_bytes": 20571754, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "3f16ad52"}, {"id": "gha-024", "title": "Automating Datacenter Operations: Reliability Through Repeatability", "hook": "Manual operations do not scale to datacenter complexity. Repetition without automation eventually turns into availability debt.", "description": "An expert lesson on automating infrastructure operations safely: desired state, validation gates, rollback paths, and control-plane trust.", "problem": "Organizations automate one-off tasks but leave maintenance, provisioning, and recovery steps partially manual, creating inconsistent states and operator risk.", "explanation": "Datacenter automation is effective when workflows are encoded as validated state transitions rather than brittle command scripts. Experts build idempotent automation, preflight checks, concurrency control, canary execution, and authoritative inventory so that infrastructure change becomes observable and reversible. Automation must also account for exception paths, because blindly accelerating bad change is worse than manual slowness. Operational maturity comes from repeatability plus guardrails.", "summary": "Automate infrastructure so that change becomes consistent, reviewable, and reversible under pressure.", "lesson_id": "gha-024", "concept_id": "datacenter-automation", "concept": "datacenter-automation", "category": "availability", "difficulty": 4, "mask_url": "video_pipeline/output/65178cf4/mask.webm", "audio_url": "video_pipeline/output/65178cf4/audio.mp3", "full_url": "video_pipeline/output/65178cf4/full.mp4", "timing_url": "video_pipeline/output/65178cf4/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789710.8960638, "size_bytes": 15327727, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "65178cf4"}, {"id": "gha-023", "title": "High Availability Architecture: Redundancy, Independence, and Fast Recovery", "hook": "High availability is not just multiple copies of a service. It is multiple copies that fail differently, recover predictably, and do not share the same blind spots.", "description": "A deep lesson on HA design across zones, regions, dependencies, state stores, control planes, and operational runbooks.", "problem": "Architectures look redundant on paper but still fail as one because they share identity systems, storage layers, deployment tooling, or operational assumptions.", "explanation": "High availability design begins with failure-domain analysis. Experts identify what is replicated, what is independent, what is synchronous, and what becomes the hidden single point of failure during failover. Recovery speed, data consistency posture, and operator clarity matter as much as replica count. HA architecture is strongest when it is tested end to end, including degraded operations and rollback paths.", "summary": "Redundancy only buys availability when failure domains are truly separated and recovery paths are practiced.", "lesson_id": "gha-023", "concept_id": "high-availability-architecture", "concept": "high-availability-architecture", "category": "availability", "difficulty": 4, "mask_url": "video_pipeline/output/e570ed21/mask.webm", "audio_url": "video_pipeline/output/e570ed21/audio.mp3", "full_url": "video_pipeline/output/e570ed21/full.mp4", "timing_url": "video_pipeline/output/e570ed21/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789709.8960638, "size_bytes": 17034224, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "e570ed21"}, {"id": "gha-022", "title": "Event Surge Readiness: Operating Safely Through Demand Spikes", "hook": "Global events do not merely add traffic. They compress decision time, amplify hot paths, and expose every hidden capacity assumption.", "description": "An expert lesson on surge handling: capacity envelopes, admission control, read-write prioritization, and live operational coordination.", "problem": "Systems that survive normal daily variance often fail during launches, incidents, or world events because they never modeled burst shape and shared contention.", "explanation": "Event surge readiness requires more than autoscaling. It requires understanding which workloads are latency-sensitive, which requests may be deferred, which caches will go cold, and which dependencies cannot scale linearly. Experts combine traffic shaping, graceful degradation, queue discipline, synthetic rehearsal, and explicit operational playbooks. The system should fail selectively and intelligibly rather than universally and chaotically.", "summary": "Prepare for spikes by deciding ahead of time what the system must preserve, what it may shed, and how operators stay in control.", "lesson_id": "gha-022", "concept_id": "surge-readiness", "concept": "surge-readiness", "category": "availability", "difficulty": 4, "mask_url": "video_pipeline/output/e570ed21/mask.webm", "audio_url": "video_pipeline/output/e570ed21/audio.mp3", "full_url": "video_pipeline/output/e570ed21/full.mp4", "timing_url": "video_pipeline/output/e570ed21/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789708.8960638, "size_bytes": 17034224, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "e570ed21"}, {"id": "gha-021", "title": "Monitoring for High Availability: Signals That Actually Predict User Pain", "hook": "High availability depends less on dashboards that look busy and more on signals that reveal user impact before the outage widens.", "description": "A deeper lesson on availability monitoring, service-level indicators, dependency visibility, saturation signals, and alerting quality.", "problem": "Teams monitor infrastructure health but miss user-visible degradation caused by queueing, retries, partial failures, or exhausted downstream capacity.", "explanation": "Availability monitoring should reflect the service contract, not just machine status. Expert teams track latency percentiles, error rates, saturation, dependency budgets, and degradation paths that predict business impact. Alerting must distinguish noise from actionability, and observability should support quick isolation of whether the issue is code, capacity, dependency, or control plane. Monitoring is architecture because it defines what the system can know about itself while failing.", "summary": "If your monitoring cannot explain user pain quickly, it is not yet availability-grade observability.", "lesson_id": "gha-021", "concept_id": "monitoring-high-availability", "concept": "monitoring-high-availability", "category": "availability", "difficulty": 4, "mask_url": "video_pipeline/output/d0af26de/mask.webm", "audio_url": "video_pipeline/output/d0af26de/audio.mp3", "full_url": null, "timing_url": "video_pipeline/output/d0af26de/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789707.8960638, "size_bytes": 2412405, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "d0af26de"}, {"id": "gha-020", "title": "Resilience Engineering: Designing Systems to Adapt Under Stress", "hook": "Resilience is not the absence of failure. It is the capacity to absorb disruption, adapt, and keep critical outcomes intact.", "description": "An expert lesson on resilience engineering across software, infrastructure, automation, and human operations.", "problem": "Systems can be redundant and still fragile if people lack visibility, automation behaves unexpectedly, or dependencies fail in correlated ways.", "explanation": "Resilience engineering expands the frame beyond components. It asks how the whole socio-technical system behaves when assumptions fail: observability quality, operator decision support, automation trustworthiness, fallback design, and recovery coordination. Experts study near misses, overload behavior, and degraded-mode operation as carefully as steady-state performance. The architecture must support recovery and adaptation, not just nominal service delivery.", "summary": "True resilience is measured by adaptive capacity under stress, not by optimistic diagrams of redundancy.", "lesson_id": "gha-020", "concept_id": "resilience-engineering", "concept": "resilience-engineering", "category": "availability", "difficulty": 5, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789706.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-019", "title": "CI/CD Architecture: Delivery Systems as Security and Scale Infrastructure", "hook": "Your delivery pipeline is a production system. It needs identity, isolation, observability, and abuse resistance just like any customer-facing service.", "description": "A deep lesson on CI/CD as architecture: pipeline trust chains, ephemeral runners, artifact integrity, feedback loops, and controlled deployment automation.", "problem": "Organizations optimize pipeline speed but underinvest in runner isolation, artifact provenance, environment separation, and deployment safety semantics.", "explanation": "CI/CD architecture connects source control, build systems, secrets, artifact stores, test environments, and production release controls. Experts protect this chain because compromise here gives attackers leverage over every downstream workload. Strong patterns include ephemeral execution, signed artifacts, narrow permissions, staged promotion, policy gates, and rapid rollback. The feedback loop should be short, but the trust path should still be explicit and defensible.", "summary": "Treat CI/CD as critical infrastructure. Fast delivery only matters if the pipeline itself remains trustworthy.", "lesson_id": "gha-019", "concept_id": "cicd-architecture", "concept": "cicd-architecture", "category": "scalability", "difficulty": 4, "mask_url": "video_pipeline/output/8c06f258/mask.webm", "audio_url": "video_pipeline/output/8c06f258/audio.mp3", "full_url": "video_pipeline/output/8c06f258/full.mp4", "timing_url": "video_pipeline/output/8c06f258/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789705.8960638, "size_bytes": 17202527, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "8c06f258"}, {"id": "gha-018", "title": "Testing Microservices: Contracts, Failure Cases, and System Truth", "hook": "Microservice testing is hard because correctness lives in interactions, not only in isolated units.", "description": "An expert lesson on consumer-driven contracts, integration seams, fault injection, test data realism, and guarding against false confidence in distributed systems.", "problem": "Teams write many unit tests but still ship broken workflows because version drift, schema evolution, and timeout behavior were never tested across service boundaries.", "explanation": "Microservice testing has to validate contracts, event shapes, idempotency, error propagation, and behavior under latency or dependency loss. Experts keep most tests cheap and local but add targeted integration and resilience tests where distributed uncertainty matters. Contract testing is particularly important because it turns service compatibility into an explicit artifact rather than tribal knowledge. The goal is confidence in cross-service behavior, not only code coverage inside one repo.", "summary": "Test the boundaries, not just the internals. Distributed correctness lives where services meet and fail together.", "lesson_id": "gha-018", "concept_id": "microservice-testing", "concept": "microservice-testing", "category": "scalability", "difficulty": 4, "mask_url": "video_pipeline/output/8c06f258/mask.webm", "audio_url": "video_pipeline/output/8c06f258/audio.mp3", "full_url": "video_pipeline/output/8c06f258/full.mp4", "timing_url": "video_pipeline/output/8c06f258/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789704.8960638, "size_bytes": 17202527, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "8c06f258"}, {"id": "gha-017", "title": "Stateful Systems in Containers: Why Databases Need More Than Packaging", "hook": "Running a database in a container is easy. Running it safely under failure, backup, and recovery constraints is where architecture begins.", "description": "A deeper lesson on stateful workloads in container platforms: storage semantics, replication, failover, persistence, and operational ownership.", "problem": "Teams containerize databases for consistency but underestimate storage performance, recovery guarantees, quorum behavior, and backup architecture.", "explanation": "Stateful systems care about disk latency, write ordering, replica placement, backup integrity, and crash recovery semantics. Containers can package the process, but they do not erase the system properties of storage engines. Expert design asks where persistence lives, how failover preserves consistency, how upgrades are staged, and what automation is allowed to do during degraded states. For databases, the platform and the data plane must be designed together.", "summary": "Packaging a database is easy. Designing persistence, failover, and recovery in a container platform is the real architecture problem.", "lesson_id": "gha-017", "concept_id": "stateful-containers", "concept": "stateful-containers", "category": "scalability", "difficulty": 5, "mask_url": "video_pipeline/output/2ae00c90/mask.webm", "audio_url": "video_pipeline/output/2ae00c90/audio.mp3", "full_url": "video_pipeline/output/2ae00c90/full.mp4", "timing_url": "video_pipeline/output/2ae00c90/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789703.8960638, "size_bytes": 16796863, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "2ae00c90"}, {"id": "gha-016", "title": "Containers and Containerization: Packaging, Isolation, and Fleet Operations", "hook": "Containers solve deployment consistency, not security by magic and not architecture by themselves.", "description": "An expert lesson on what containers actually provide: packaging, scheduling portability, process isolation tradeoffs, and operational standardization.", "problem": "Teams treat containers like a complete architecture answer, then ignore image trust, runtime isolation, resource contention, and orchestration policy.", "explanation": "Containers standardize how software is packaged and launched, which is invaluable for repeatable delivery. But they share kernel assumptions, depend on orchestration quality, and require explicit security controls for identity, networking, image provenance, and secrets. Expert architects separate the benefits of immutable packaging from the risks of high-density multitenancy and noisy-neighbor effects. Containerization works best when coupled with strong platform policy and observability.", "summary": "Containers improve portability and operability, but they only become safe at scale when the surrounding platform is designed well.", "lesson_id": "gha-016", "concept_id": "containers", "concept": "containers", "category": "scalability", "difficulty": 4, "mask_url": "video_pipeline/output/971a67b8/mask.webm", "audio_url": "video_pipeline/output/971a67b8/audio.mp3", "full_url": "video_pipeline/output/971a67b8/full.mp4", "timing_url": "video_pipeline/output/971a67b8/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789702.8960638, "size_bytes": 15770629, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "971a67b8"}, {"id": "gha-015", "title": "Domain-Oriented Microservices: Boundaries Based on Business Semantics", "hook": "The safest microservice boundary is usually not a technical layer. It is a business boundary with its own language, data, and policy needs.", "description": "A deeper lesson on bounded contexts, ownership, data sovereignty, and why service boundaries should follow domain semantics rather than database tables.", "problem": "Technical decomposition creates services that look separate on a diagram but still share data models, release cycles, and failure fate.", "explanation": "Domain-oriented microservices organize architecture around cohesive capabilities such as billing, identity, catalog, or fulfillment rather than shared infrastructure concerns. Expert designers ask where invariants truly live, which data may be copied versus owned, and where policy decisions differ materially. If a boundary does not reduce coordination cost or clarify business responsibility, it is not a good service boundary. The design goal is evolutionary autonomy, not maximum service count.", "summary": "Service boundaries should minimize cross-team coordination and clarify who owns meaning, data, and change.", "lesson_id": "gha-015", "concept_id": "domain-oriented-microservices", "concept": "domain-oriented-microservices", "category": "scalability", "difficulty": 5, "mask_url": "video_pipeline/output/6eb6d932/mask.webm", "audio_url": "video_pipeline/output/6eb6d932/audio.mp3", "full_url": "video_pipeline/output/6eb6d932/full.mp4", "timing_url": "video_pipeline/output/6eb6d932/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789701.8960638, "size_bytes": 16834085, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "6eb6d932"}, {"id": "gha-014", "title": "Microservices and Orchestration: Decomposition With Operational Discipline", "hook": "Microservices buy autonomy only when the architecture can afford the operational and security cost of many moving parts.", "description": "An expert lesson on service boundaries, orchestration, deployment independence, policy consistency, and when microservices are worth their cost.", "problem": "Organizations split systems into services too early, then drown in network coupling, inconsistent contracts, duplicated security logic, and weak observability.", "explanation": "Microservices are a socio-technical pattern, not a scaling superstition. They work when bounded contexts are real, teams own services end-to-end, and the platform provides identity, logging, deployment, and policy as reusable capability. Orchestration then becomes the discipline that schedules, restarts, isolates, and upgrades services safely at fleet scale. Without strong contracts and platform guardrails, microservices fragment architecture instead of improving it.", "summary": "Break systems into services only where ownership, boundaries, and platform support make the decomposition sustainable.", "lesson_id": "gha-014", "concept_id": "microservices-orchestration", "concept": "microservices-orchestration", "category": "scalability", "difficulty": 4, "mask_url": "video_pipeline/output/6eb6d932/mask.webm", "audio_url": "video_pipeline/output/6eb6d932/audio.mp3", "full_url": "video_pipeline/output/6eb6d932/full.mp4", "timing_url": "video_pipeline/output/6eb6d932/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789700.8960638, "size_bytes": 16834085, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "6eb6d932"}, {"id": "gha-013", "title": "Reliable Traffic Steering: Redirect Without Creating New Failure Modes", "hook": "Traffic redirection is powerful because it can rescue a bad situation quickly. It is dangerous because it can move failure faster than humans can think.", "description": "A lesson on load balancers, routing layers, health signals, failover, and software-defined traffic control under degraded conditions.", "problem": "Failover and routing logic often trust shallow health checks, causing systems to send traffic into black holes or oscillate between unstable destinations.", "explanation": "Reliable traffic steering depends on correct health semantics, failure-domain awareness, and backpressure. Experts distinguish liveness from readiness, slow degradation from hard failure, and local health from end-to-end service quality. Routing layers must avoid thundering herds, support canaries and draining, and preserve operator control during incident response. Steering is not only about balancing; it is about preserving system correctness while conditions change.", "summary": "Traffic control is part of the architecture's safety system. Route only when your health model is trustworthy.", "lesson_id": "gha-013", "concept_id": "traffic-steering", "concept": "traffic-steering", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/e570ed21/mask.webm", "audio_url": "video_pipeline/output/e570ed21/audio.mp3", "full_url": "video_pipeline/output/e570ed21/full.mp4", "timing_url": "video_pipeline/output/e570ed21/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789699.8960638, "size_bytes": 17034224, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "e570ed21"}, {"id": "gha-012", "title": "Life Beyond Distributed Transactions: Coordination Without Fragility", "hook": "Once a system spans services, perfect atomic coordination becomes expensive, slow, and operationally brittle.", "description": "A deeper lesson on sagas, compensating actions, outbox patterns, idempotency, and designing consistency around business semantics instead of database fantasy.", "problem": "Teams model cross-service workflows as if a single ACID transaction could still save them, then discover that latency, partial failure, and retries corrupt the workflow anyway.", "explanation": "Distributed systems replace one big transaction boundary with many smaller state transitions that may succeed or fail independently. Expert architectures therefore define recovery semantics explicitly: what must be strongly consistent, what can be eventually reconciled, and which compensations are acceptable in business terms. Patterns like outbox, inbox deduplication, sagas, and idempotency keys matter because they encode operational truth into the design. The architecture must tolerate replay, delay, and partial completion without losing correctness.", "summary": "Do not imitate local transactions across a distributed system. Design consistency and recovery as first-class workflow behavior.", "lesson_id": "gha-012", "concept_id": "distributed-transactions", "concept": "distributed-transactions", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/6eb6d932/mask.webm", "audio_url": "video_pipeline/output/6eb6d932/audio.mp3", "full_url": "video_pipeline/output/6eb6d932/full.mp4", "timing_url": "video_pipeline/output/6eb6d932/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789698.8960638, "size_bytes": 16834085, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "6eb6d932"}, {"id": "gha-011", "title": "Scaling Bottlenecks: CPU, IO, State, and Coordination", "hook": "Most scaling failures are not caused by lack of servers. They are caused by the wrong bottleneck being invisible until it dominates.", "description": "How to reason about scaling bottlenecks in databases, queues, CPU-bound services, network saturation, and shared state coordination.", "problem": "Teams throw replicas at performance problems that are actually caused by serialization points, lock contention, hot partitions, or expensive state transitions.", "explanation": "Bottlenecks emerge where work cannot be parallelized cheaply: single writers, cross-shard joins, queue consumers with strict ordering, expensive crypto, cold cache paths, and external control-plane calls. Expert diagnosis distinguishes throughput limits from latency spikes and steady-state constraints from overload collapse. Good architecture localizes bottlenecks, instruments them directly, and provides escape hatches such as sharding, batching, asynchronous flow, or differentiated workloads.", "summary": "You scale by finding the real constraint, not by multiplying components blindly.", "lesson_id": "gha-011", "concept_id": "scaling-bottlenecks", "concept": "scaling-bottlenecks", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/e570ed21/mask.webm", "audio_url": "video_pipeline/output/e570ed21/audio.mp3", "full_url": "video_pipeline/output/e570ed21/full.mp4", "timing_url": "video_pipeline/output/e570ed21/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789697.8960638, "size_bytes": 17034224, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "e570ed21"}, {"id": "gha-010", "title": "Service Availability Math: Reliability as a Composed Property", "hook": "Availability is not a badge you buy. It is the product of every dependency, every recovery path, and every operational assumption.", "description": "A deep lesson on availability budgets, dependency composition, blast radius, maintenance strategy, and what multi-zone or multi-region actually buys you.", "problem": "Systems advertise target uptime but ignore how synchronous dependencies, operational procedures, and shared control planes erode real availability.", "explanation": "Availability composes poorly when request paths depend on many components. Even highly reliable subsystems can create weak overall availability when chained synchronously. Expert architecture decomposes which failures are tolerable, which are user-visible, and which paths can degrade safely. Redundancy only helps when failure domains are independent, health signals are trustworthy, and failover is both fast and practiced.", "summary": "Availability is architecture plus operations plus math. Dependency shape matters as much as redundancy count.", "lesson_id": "gha-010", "concept_id": "service-availability", "concept": "service-availability", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/e570ed21/mask.webm", "audio_url": "video_pipeline/output/e570ed21/audio.mp3", "full_url": "video_pipeline/output/e570ed21/full.mp4", "timing_url": "video_pipeline/output/e570ed21/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789696.8960638, "size_bytes": 17034224, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "e570ed21"}, {"id": "gha-009", "title": "Latency Engineering: Tail Behavior, Queues, and the Cost of Distance", "hook": "Users feel the slowest part of the request path, not the average.", "description": "An expert lesson on why latency is architectural: queueing, serialization, fan-out, network hops, retry storms, and the economics of tail latency.", "problem": "Teams optimize average response time while users suffer from p95 and p99 delays caused by congestion, contention, and hidden dependency chains.", "explanation": "Latency accumulates through network distance, handshake costs, queue wait, disk I/O, contention, and coordination across services. At scale, parallelism can lower average latency while increasing tail latency if even one sub-call stalls. Expert architecture uses timeouts, concurrency budgets, hedging carefully, and coarse-grained dependency reduction to stop latency amplification. Observability must show not just duration but where time was spent and how retries altered system load.", "summary": "Latency is a systems property. Design for p95 and p99 behavior, not just the median.", "lesson_id": "gha-009", "concept_id": "latency-engineering", "concept": "latency-engineering", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/a64d9600/mask.webm", "audio_url": "video_pipeline/output/a64d9600/audio.mp3", "full_url": "video_pipeline/output/a64d9600/full.mp4", "timing_url": "video_pipeline/output/a64d9600/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789695.8960638, "size_bytes": 22708219, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "a64d9600"}, {"id": "gha-008", "title": "Caching and Anti-Caching: When Speed Helps and When Freshness Matters More", "hook": "Caching is often the fastest way to scale a system and the fastest way to lie to yourself about correctness.", "description": "A deeper lesson on caching strategy, invalidation, consistency windows, negative caching, and cases where caching increases systemic risk.", "problem": "Teams add caches to relieve pressure but fail to define freshness guarantees, invalidation authority, or failure behavior, creating stale or unsafe data paths.", "explanation": "Caching shifts work away from expensive systems, but it also introduces another state layer whose semantics must be owned. Expert design asks which data may be stale, who invalidates it, what happens on cache miss, and whether stale data is merely inconvenient or security-relevant. Anti-caching matters when correctness, revocation, pricing, authorization, or compliance state must reflect reality immediately. The right architecture distinguishes data that benefits from temporal decoupling from data whose safety depends on freshness.", "summary": "Use caches deliberately: they are performance tools with consistency, revocation, and security consequences.", "lesson_id": "gha-008", "concept_id": "caching", "concept": "caching", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/ace9ad25/mask.webm", "audio_url": "video_pipeline/output/ace9ad25/audio.mp3", "full_url": "video_pipeline/output/ace9ad25/full.mp4", "timing_url": "video_pipeline/output/ace9ad25/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789694.8960638, "size_bytes": 16311657, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "ace9ad25"}, {"id": "gha-007", "title": "Chaos Engineering: Proving Resilience Instead of Assuming It", "hook": "Resilience claims are hypotheses until failure is introduced on purpose and the system survives in measurable ways.", "description": "An expert lesson on chaos engineering as disciplined resilience validation: steady-state definition, blast-radius control, and operational learning.", "problem": "Organizations say they are resilient because they have redundancy, but they rarely test whether dependencies, automation, and people behave correctly under pressure.", "explanation": "Chaos engineering is not random destruction. It begins with an expected steady state, an explicit hypothesis about system behavior, controlled fault injection, and measured outcomes. Expert teams use chaos to validate fallback paths, alerting quality, dependency isolation, and human response under constrained conditions. The real value is epistemic: replacing architecture folklore with observed system behavior.", "summary": "Chaos engineering turns resilience from a slogan into evidence.", "lesson_id": "gha-007", "concept_id": "chaos-engineering", "concept": "chaos-engineering", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789693.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-006", "title": "Enterprise Platform Architecture: Guardrails Without Gridlock", "hook": "Enterprise platforms succeed when they standardize the dangerous parts and leave teams freedom everywhere else.", "description": "How to build platform architecture for enterprises: secure multi-tenancy, policy inheritance, service boundaries, and safe self-service.", "problem": "Central platforms either become bottlenecks that slow delivery or weakly governed utility layers that spread risk everywhere.", "explanation": "Enterprise platform architecture must balance consistency with autonomy. The secure path should include identity federation, secret handling, network policy, logging, deployment baselines, and compliance evidence as reusable services. Experts avoid over-centralization by defining clear platform contracts and paved roads instead of endless approval workflows. The platform should absorb repeated security complexity once, then expose it as default capability to product teams.", "summary": "The best enterprise platform is opinionated where risk concentrates and flexible where product teams need speed.", "lesson_id": "gha-006", "concept_id": "enterprise-platform-architecture", "concept": "enterprise-platform-architecture", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/d91ed72a/mask.webm", "audio_url": "video_pipeline/output/d91ed72a/audio.mp3", "full_url": "video_pipeline/output/d91ed72a/full.mp4", "timing_url": "video_pipeline/output/d91ed72a/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789692.8960638, "size_bytes": 17570989, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "d91ed72a"}, {"id": "gha-005", "title": "Efficiency, Reliability, and Scaling: Architecture as Tradeoff Management", "hook": "Architecture is the art of deciding where you spend complexity to buy performance, reliability, and safe scale.", "description": "A deeper lesson on the hard tradeoffs between throughput, latency, redundancy, operational cost, and security assurance.", "problem": "Teams optimize a single metric in isolation, then pay later in brittle systems, hidden coupling, or runaway operational cost.", "explanation": "Efficiency is not merely resource savings; it is the disciplined reduction of waste in request paths, state management, and operator effort. Reliability is not simply redundancy; it depends on elimination of correlated fail
