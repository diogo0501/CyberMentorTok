 "plr-020", "title": "Attack Paths in the Cloud: From Misconfiguration to Material Impact", "hook": "Single findings matter less than the path that connects them to privilege, data, or disruption.", "description": "A dense advanced lesson on attack-path thinking across IAM, storage, network, workload, and monitoring gaps.", "problem": "Security teams drown in isolated findings because they do not consistently model how multiple weaknesses compose into an actual compromise route.", "explanation": "Cloud attack paths often start with an initial foothold such as exposed credentials, weak federation, public storage, or an over-permissive workload identity. The attacker then chains privilege escalation, discovery, lateral movement, and data access through control-plane APIs or workload weaknesses. Experts prioritize remediation by path value: which combinations actually grant business-impacting capability, not which single misconfiguration looks scariest alone. This is where architecture, detection, and IAM knowledge converge.", "summary": "Risk is best understood as reachable outcome through chained weakness, not as a flat list of findings.", "lesson_id": "plr-020", "concept_id": "cloud-attack-paths", "concept": "cloud-attack-paths", "category": "roadmap-advanced", "difficulty": 4, "mask_url": "video_pipeline/output/f3ef33f4/mask.webm", "audio_url": "video_pipeline/output/f3ef33f4/audio.mp3", "full_url": "video_pipeline/output/f3ef33f4/full.mp4", "timing_url": "video_pipeline/output/f3ef33f4/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791706.8960638, "size_bytes": 17645701, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "f3ef33f4"}, {"id": "plr-019", "title": "Cloud Security Posture Management: What It Solves and What It Cannot", "hook": "Posture tools are useful because cloud misconfigurations are abundant. They are dangerous when teams mistake findings for a security strategy.", "description": "A deeper lesson on CSPM, configuration drift, control coverage, and the gap between findings and real risk reduction.", "problem": "Teams deploy posture tools, close a subset of alerts, and assume the environment is secure even though identity paths, workload flaws, and business context remain poorly understood.", "explanation": "CSPM tools excel at continuously checking policy and configuration against known patterns: public exposure, weak logging, encryption gaps, risky identities, and missing controls. Experts use them as inventory and drift-detection engines, then layer identity reasoning, attack-path analysis, and workload-specific context on top. CSPM is powerful for breadth, but it does not replace architectural judgment, incident readiness, or deep service knowledge.", "summary": "Use posture tools as visibility accelerators, not as substitutes for threat reasoning and architecture understanding.", "lesson_id": "plr-019", "concept_id": "cspm-basics", "concept": "cspm-basics", "category": "roadmap-advanced", "difficulty": 3, "mask_url": "video_pipeline/output/65178cf4/mask.webm", "audio_url": "video_pipeline/output/65178cf4/audio.mp3", "full_url": "video_pipeline/output/65178cf4/full.mp4", "timing_url": "video_pipeline/output/65178cf4/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791705.8960638, "size_bytes": 15327727, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "65178cf4"}, {"id": "plr-018", "title": "Disaster Recovery for Cloud Security Engineers", "hook": "Recovery is part of security because attackers, accidents, and outages all test whether you can restore trustworthy service.", "description": "A denser lesson on backup trust, immutable recovery, region failover, and rebuilding secure state after disruption.", "problem": "Organizations back data up but do not know whether they can restore it safely, quickly, or without reintroducing the compromise.", "explanation": "Disaster recovery in cloud environments includes not only data restoration but identity recovery, network baseline restoration, key access, pipeline trust, and validation that recovered assets are not still contaminated. Experts care about immutable backups, separation between production and recovery control paths, and exercises that prove the environment can re-emerge securely. Recovery that restores compromised policy or stale keys is not a successful recovery.", "summary": "Disaster recovery is secure-state restoration, not just file restoration.", "lesson_id": "plr-018", "concept_id": "cloud-dr-foundations", "concept": "cloud-dr-foundations", "category": "roadmap-advanced", "difficulty": 3, "mask_url": "video_pipeline/output/27e2daad/mask.webm", "audio_url": "video_pipeline/output/27e2daad/audio.mp3", "full_url": "video_pipeline/output/27e2daad/full.mp4", "timing_url": "video_pipeline/output/27e2daad/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791704.8960638, "size_bytes": 15017203, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "27e2daad"}, {"id": "plr-017", "title": "Cloud Incident Response: Containment Without Destroying Evidence", "hook": "Cloud incidents move fast because credentials, APIs, and automation can scale the attacker's reach instantly.", "description": "A lesson on response sequencing for cloud incidents: scoping, containment, identity control, evidence preservation, and recovery.", "problem": "Teams rush to shut systems down and accidentally destroy volatile evidence, sever forensic context, or break the business without containing the actual attacker path.", "explanation": "Cloud incident response must account for identity revocation, policy rollback, snapshot capture, log preservation, and sometimes pausing automation that would otherwise erase traces or redeploy compromised state. Experts distinguish data-plane symptoms from control-plane causes and aim to contain the attack path rather than just the loudest host. The cloud changes response because the control plane itself is often both the breach vector and the recovery lever.", "summary": "Respond to cloud incidents by preserving evidence, constraining attacker identity paths, and understanding control-plane state before destroying it.", "lesson_id": "plr-017", "concept_id": "cloud-incident-response", "concept": "cloud-incident-response", "category": "roadmap-advanced", "difficulty": 3, "mask_url": "video_pipeline/output/1cac313b/mask.webm", "audio_url": "video_pipeline/output/1cac313b/audio.mp3", "full_url": "video_pipeline/output/1cac313b/full.mp4", "timing_url": "video_pipeline/output/1cac313b/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791703.8960638, "size_bytes": 17837396, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "1cac313b"}, {"id": "plr-016", "title": "Detection Engineering in the Cloud: From Log Collection to Useful Detections", "hook": "Collecting logs is easy compared with deciding what suspicious cloud behavior actually looks like.", "description": "A denser lesson on cloud detections for IAM abuse, storage exposure, unusual regions, service misuse, and control-plane drift.", "problem": "Security teams ingest huge cloud telemetry streams but produce noisy detections that miss meaningful attacker behavior.", "explanation": "Detection engineering translates cloud attack paths into observable signals such as impossible role use, unusual API sequencing, unexpected region deployment, bursty secret access, or policy weakening. Experts care about baseline quality, field normalization, context enrichment, and which detections truly map to attacker tradecraft versus administrative variance. Strong detections are hypothesis-driven and measurable, not merely query collections.", "summary": "Detection quality comes from understanding cloud attacker behavior well enough to ask the telemetry specific, useful questions.", "lesson_id": "plr-016", "concept_id": "cloud-detection-engineering", "concept": "cloud-detection-engineering", "category": "roadmap-core", "difficulty": 3, "mask_url": "video_pipeline/output/10e72169/mask.webm", "audio_url": "video_pipeline/output/10e72169/audio.mp3", "full_url": "video_pipeline/output/10e72169/full.mp4", "timing_url": "video_pipeline/output/10e72169/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791702.8960638, "size_bytes": 17101328, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "10e72169"}, {"id": "plr-015", "title": "Logging Foundations: What to Turn On Before You Need It", "hook": "Incident response begins long before the incident, usually with one checkbox someone forgot to enable.", "description": "A dense foundations lesson on cloud audit logs, flow logs, workload logs, and telemetry retention strategy.", "problem": "Organizations try to investigate cloud events without account-level audit trails, network logs, or centralized retention, then discover the evidence never existed.", "explanation": "Logging foundations start with control-plane audit logs, identity events, storage access records, network flow visibility, and workload/application telemetry. Experts decide which logs are high-value, where they aggregate, how long they are retained, and who can tamper with or disable them. A logging architecture must be trustworthy under compromise, or it becomes a post-breach comfort blanket rather than evidence.", "summary": "Turn on the logs that explain identity, control-plane change, storage access, and network behavior before you ever need them.", "lesson_id": "plr-015", "concept_id": "logging-foundations", "concept": "logging-foundations", "category": "roadmap-core", "difficulty": 2, "mask_url": "video_pipeline/output/d0af26de/mask.webm", "audio_url": "video_pipeline/output/d0af26de/audio.mp3", "full_url": null, "timing_url": "video_pipeline/output/d0af26de/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791701.8960638, "size_bytes": 2412405, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "d0af26de"}, {"id": "plr-014", "title": "Storage Security: Buckets, Snapshots, and Data Exposure Patterns", "hook": "Storage breaches are often boring in mechanism and catastrophic in impact.", "description": "A roadmap lesson on cloud storage security from object stores to disks, snapshots, and managed databases.", "problem": "Teams focus on compute while data leaks happen through public buckets, permissive sharing, exposed snapshots, and over-broad access paths.", "explanation": "Storage security requires understanding object policies, block snapshot exposure, replica access, lifecycle rules, encryption settings, and audit trails for reads and writes. Experts also look at cross-account sharing, backup inheritance, data residency, and whether non-production copies quietly bypass production controls. The cloud makes storage durable and easy to share; that convenience is exactly why governance must be deliberate.", "summary": "Data exposure often comes from storage defaults, copy paths, and sharing semantics rather than dramatic software exploits.", "lesson_id": "plr-014", "concept_id": "storage-security-patterns", "concept": "storage-security-patterns", "category": "roadmap-core", "difficulty": 2, "mask_url": "video_pipeline/output/2ae00c90/mask.webm", "audio_url": "video_pipeline/output/2ae00c90/audio.mp3", "full_url": "video_pipeline/output/2ae00c90/full.mp4", "timing_url": "video_pipeline/output/2ae00c90/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791700.8960638, "size_bytes": 16796863, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "2ae00c90"}, {"id": "plr-013", "title": "Encryption Basics for Cloud Engineers: At Rest, In Transit, and In Use", "hook": "Encryption becomes useful only when you know exactly what threat it addresses and what it does not.", "description": "A dense fundamentals lesson on encryption states and the architecture decisions behind each one.", "problem": "Beginners hear 'encrypted' and assume data is universally safe, without asking from whom, at what moment, and under whose key control.", "explanation": "Encryption at rest protects stored media and snapshots, encryption in transit protects data crossing untrusted paths, and encryption in use is a more specialized concern involving memory exposure and confidential compute models. Experts care about where keys live, who can request decrypt, how logs expose plaintext, and whether provider-managed defaults satisfy the organization's trust model. The security value of encryption depends on key architecture, access paths, and operational practices.", "summary": "Always ask what is encrypted, when, under whose keys, and against which threat.", "lesson_id": "plr-013", "concept_id": "cloud-encryption-basics", "concept": "cloud-encryption-basics", "category": "roadmap-core", "difficulty": 2, "mask_url": "video_pipeline/output/e2a3cee0/mask.webm", "audio_url": "video_pipeline/output/e2a3cee0/audio.mp3", "full_url": "video_pipeline/output/e2a3cee0/full.mp4", "timing_url": "video_pipeline/output/e2a3cee0/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791699.8960638, "size_bytes": 16860472, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "e2a3cee0"}, {"id": "plr-012", "title": "Cloud Firewalls and Microsegmentation", "hook": "Segmentation in the cloud is less about perimeter walls and more about shrinking lateral movement options.", "description": "A dense network lesson on security groups, network ACLs, service mesh policy, and workload-level segmentation.", "problem": "Teams recreate flat internal networks in the cloud, assuming the external edge matters most while east-west exposure remains broad.", "explanation": "Microsegmentation in cloud environments combines provider-native controls, workload identity, private endpoints, and sometimes service-mesh authorization. Experts avoid broad internal trust by scoping who may talk to whom, on which ports, under which service identity, and with what observability. Good segmentation should remain understandable during incidents and should not be so complex that operators disable it under pressure.", "summary": "Cloud segmentation is about enforcing least privilege for service-to-service traffic, not just hardening the public edge.", "lesson_id": "plr-012", "concept_id": "cloud-microsegmentation", "concept": "cloud-microsegmentation", "category": "roadmap-core", "difficulty": 3, "mask_url": "video_pipeline/output/6ba9aed4/mask.webm", "audio_url": "video_pipeline/output/6ba9aed4/audio.mp3", "full_url": "video_pipeline/output/6ba9aed4/full.mp4", "timing_url": "video_pipeline/output/6ba9aed4/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791698.8960638, "size_bytes": 14883680, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "6ba9aed4"}, {"id": "plr-011", "title": "Network Security Basics: VPCs, Subnets, Routes, and Reachability", "hook": "Cloud networking feels abstract until you realize every exposure is just reachability plus trust.", "description": "A beginner-to-intermediate lesson on the cloud network constructs every security engineer must understand.", "problem": "People memorize terms like VPC and subnet without understanding how routes, gateways, and filters together decide whether traffic can reach anything useful.", "explanation": "Cloud network security begins with address space, subnet purpose, route tables, internet or NAT gateways, private connectivity, and stateful or stateless filtering layers. Experts think in reachability graphs: from where, to what, through which routes, under which identity or protocol assumptions. This makes it possible to reason about attack surface, segmentation, exfiltration, and incident containment at a provider-native level.", "summary": "Cloud networking is security when you can explain who can reach what, by which path, and why.", "lesson_id": "plr-011", "concept_id": "cloud-network-basics", "concept": "cloud-network-basics", "category": "roadmap-core", "difficulty": 2, "mask_url": "video_pipeline/output/aeb6c556/mask.webm", "audio_url": "video_pipeline/output/aeb6c556/audio.mp3", "full_url": "video_pipeline/output/aeb6c556/full.mp4", "timing_url": "video_pipeline/output/aeb6c556/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791697.8960638, "size_bytes": 17571984, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "aeb6c556"}, {"id": "plr-010", "title": "Privilege Escalation in the Cloud: How Small Permissions Become Big Ones", "hook": "Many dangerous cloud permissions do not look like admin until they are chained with one more action.", "description": "A denser IAM lesson on escalation paths through role assumption, policy attachment, pass-role rights, and service abuse.", "problem": "Organizations review identities for obvious admin rights but miss the indirect paths that still let attackers mint stronger access.", "explanation": "Cloud privilege escalation usually exploits meta-permissions: creating credentials, attaching policies, passing high-privilege roles to services, editing trust policies, or triggering managed services under stronger identities. Experts map these paths continuously because modern attackers do not need one giant admin policy if they can synthesize equivalent power through control-plane steps. Least privilege therefore means constraining capability graphs, not just removing the word admin.", "summary": "Escalation risk lives in what identities can become, not just in what they are today.", "lesson_id": "plr-010", "concept_id": "cloud-privilege-escalation", "concept": "cloud-privilege-escalation", "category": "roadmap-core", "difficulty": 3, "mask_url": "video_pipeline/output/81bb67f2/mask.webm", "audio_url": "video_pipeline/output/81bb67f2/audio.mp3", "full_url": null, "timing_url": "video_pipeline/output/81bb67f2/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791696.8960638, "size_bytes": 2663976, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "81bb67f2"}, {"id": "plr-009", "title": "IAM Evaluation Logic: Explicit Deny, Resource Policy, and Permission Boundaries", "hook": "Access control mistakes happen when engineers reason about one policy document instead of the full evaluation engine.", "description": "A denser IAM lesson on how cloud providers evaluate multiple policy types and why boundaries matter.", "problem": "Security teams misdiagnose access because they do not model the interaction between identity policy, resource policy, SCPs, permission boundaries, and explicit deny.", "explanation": "Effective permission is an evaluation problem, not a reading problem. Experts understand precedence rules: explicit deny wins, some policy types intersect while others union, and boundaries or org-level guardrails can narrow what identity policy otherwise permits. This matters operationally because debugging access and proving least privilege both require an accurate mental model of the evaluator, not just the documents stored in the console.", "summary": "Learn the evaluator, not only the syntax. Cloud IAM is an engine with precedence, not a pile of JSON.", "lesson_id": "plr-009", "concept_id": "iam-evaluation-logic", "concept": "iam-evaluation-logic", "category": "roadmap-core", "difficulty": 3, "mask_url": "video_pipeline/output/81bb67f2/mask.webm", "audio_url": "video_pipeline/output/81bb67f2/audio.mp3", "full_url": null, "timing_url": "video_pipeline/output/81bb67f2/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791695.8960638, "size_bytes": 2663976, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "81bb67f2"}, {"id": "plr-008", "title": "IAM Foundations: Principals, Policies, and Effective Permissions", "hook": "In cloud security, the most important network boundary is often the permission graph.", "description": "A deeper beginner lesson on identities, roles, groups, policies, inheritance, and why effective permission is the real question.", "problem": "People read one policy in isolation and think they understand access, while the real permission outcome is produced by many overlapping layers.", "explanation": "IAM starts with principals such as users, services, and workloads, but the important step is evaluating effective permission after all attached policies, conditions, groups, boundaries, and resource policies combine. Experts also care about assumption paths: who can impersonate whom, who can create new credentials, and who can attach stronger policy than they currently hold. IAM is foundational because almost every serious cloud breach involves identity misuse somewhere in the chain.", "summary": "Do not ask only what a policy says. Ask what a principal can effectively do after every path and condition is applied.", "lesson_id": "plr-008", "concept_id": "iam-foundations", "concept": "iam-foundations", "category": "roadmap-core", "difficulty": 2, "mask_url": "video_pipeline/output/cac4f7d2/mask.webm", "audio_url": "video_pipeline/output/cac4f7d2/audio.mp3", "full_url": "video_pipeline/output/cac4f7d2/full.mp4", "timing_url": "video_pipeline/output/cac4f7d2/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791694.8960638, "size_bytes": 16076011, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "cac4f7d2"}, {"id": "plr-007", "title": "Scripting for Security Engineers: Automating Boring Checks Without Becoming Fragile", "hook": "Automation is how security work scales, but weak automation can spread bad assumptions just as fast.", "description": "A practical lesson on why scripting matters for cloud security engineers and what kinds of tasks it should handle first.", "problem": "Manual reviews do not scale across accounts, policies, buckets, logs, and findings, but beginners often over-automate before understanding the signal.", "explanation": "Security engineers script inventory collection, policy checks, key rotation audits, log parsing, and evidence gathering long before they build complex platforms. Experts keep automation narrow, observable, and testable at first, because brittle scripts with broad permissions can create silent operational risk. Good automation removes repetitive toil while making assumptions explicit and reviewable.", "summary": "Automate repetitive inspection first. Scale signal, not confusion.", "lesson_id": "plr-007", "concept_id": "security-automation-basics", "concept": "security-automation-basics", "category": "roadmap-foundation", "difficulty": 2, "mask_url": "video_pipeline/output/8c06f258/mask.webm", "audio_url": "video_pipeline/output/8c06f258/audio.mp3", "full_url": "video_pipeline/output/8c06f258/full.mp4", "timing_url": "video_pipeline/output/8c06f258/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791693.8960638, "size_bytes": 17202527, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "8c06f258"}, {"id": "plr-006", "title": "The Hacker Mindset for Defenders: Thinking in Paths, Not Products", "hook": "Attackers do not care which tool category you bought. They care which path gets them from weak point to valuable outcome.", "description": "A roadmap lesson on attacker thinking for cloud defenders: chaining weaknesses, abusing trust, and following permissions.", "problem": "Defenders often think in isolated controls, while attackers think in sequences of opportunities that compound each other.", "explanation": "The hacker mindset is about pathfinding. A low-severity metadata exposure, an over-broad role, and a neglected logging gap may combine into a full account compromise. Experts train themselves to think in attack graphs, credential movement, control bypasses, and business impact rather than only in single misconfigurations. This mindset improves architecture review, threat modeling, and incident triage because it emphasizes how local weaknesses become systemic breaches.", "summary": "Think like an attacker by tracing how small trust failures compose into real access and real damage.", "lesson_id": "plr-006", "concept_id": "hacker-mindset", "concept": "hacker-mindset", "category": "roadmap-foundation", "difficulty": 2, "mask_url": "video_pipeline/output/f3ef33f4/mask.webm", "audio_url": "video_pipeline/output/f3ef33f4/audio.mp3", "full_url": "video_pipeline/output/f3ef33f4/full.mp4", "timing_url": "video_pipeline/output/f3ef33f4/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791692.8960638, "size_bytes": 17645701, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "f3ef33f4"}, {"id": "plr-005", "title": "Cloud Security Principles: Least Privilege, Defense in Depth, and Explicit Trust", "hook": "Before tools, services, or certifications, cloud security is a set of design principles that explain what good looks like.", "description": "A dense foundations lesson on the core principles that recur across every cloud security domain.", "problem": "Beginners learn controls one by one but never connect them to deeper principles, so they struggle to reason when the environment changes.", "explanation": "Cloud security principles include least privilege, explicit trust verification, immutable infrastructure bias, separation of duties, defense in depth, and observability as a safety property. Experts use principles as compression: they let you evaluate unfamiliar services quickly because you can ask how identity is scoped, how blast radius is bounded, where monitoring exists, and what happens during failure. Principles turn cloud security from memorization into judgment.", "summary": "Principles are the mental model that make cloud security transferable across providers and technologies.", "lesson_id": "plr-005", "concept_id": "cloud-security-principles", "concept": "cloud-security-principles", "category": "roadmap-foundation", "difficulty": 1, "mask_url": "video_pipeline/output/06f1eef0/mask.webm", "audio_url": "video_pipeline/output/06f1eef0/audio.mp3", "full_url": "video_pipeline/output/06f1eef0/full.mp4", "timing_url": "video_pipeline/output/06f1eef0/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791691.8960638, "size_bytes": 17270626, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "06f1eef0"}, {"id": "plr-004", "title": "Shared Responsibility in Practice: Where Provider Security Ends and Yours Begins", "hook": "The shared responsibility model is simple to memorize and surprisingly easy to misunderstand in real systems.", "description": "A beginner lesson on translating the shared responsibility model into practical security ownership.", "problem": "Teams think a managed cloud service means the provider handles security end to end, then miss their own duties around identity, configuration, and data protection.", "explanation": "Providers secure the cloud's foundational layers, but customers still control access, network exposure, secrets, data classification, logging choices, and workload code. Experts go further by mapping responsibility at service granularity because a serverless database, a VM, and a SaaS identity integration each split duties differently. The shared responsibility model becomes useful only when translated into precise ownership statements and operational checks.", "summary": "Know exactly what the provider secures, what you still configure, and how that answer changes by service type.", "lesson_id": "plr-004", "concept_id": "shared-responsibility-practice", "concept": "shared-responsibility-practice", "category": "roadmap-foundation", "difficulty": 1, "mask_url": "video_pipeline/output/5925bf59/mask.webm", "audio_url": "video_pipeline/output/5925bf59/audio.mp3", "full_url": "video_pipeline/output/5925bf59/full.mp4", "timing_url": "video_pipeline/output/5925bf59/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791690.8960638, "size_bytes": 19227614, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "5925bf59"}, {"id": "plr-003", "title": "Choose One Cloud First: Why Depth Beats Multi-Cloud Shallowness", "hook": "A cloud security career usually begins faster when one provider becomes second nature before three providers become confusing.", "description": "Why the roadmap starts with one cloud provider and how deep provider fluency accelerates later security learning.", "problem": "Beginners spread attention across AWS, Azure, and GCP too early, never building the mental model required to spot dangerous provider-specific mistakes.", "explanation": "Each cloud provider has its own identity fabric, networking model, storage semantics, audit layers, and control-plane assumptions. Experts know that real mistakes happen inside those provider-specific details, not in generic cloud buzzwords. Starting with one provider creates depth in terminology, service relationships, and hands-on troubleshooting, which later transfers into stronger multi-cloud reasoning. Breadth without depth often produces certification vocabulary but not defensive capability.", "summary": "Go deep in one provider first. Security insight comes from concrete provider mechanics, not generic multi-cloud familiarity.", "lesson_id": "plr-003", "concept_id": "one-cloud-provider", "concept": "one-cloud-provider", "category": "roadmap-foundation", "difficulty": 1, "mask_url": "video_pipeline/output/d91ed72a/mask.webm", "audio_url": "video_pipeline/output/d91ed72a/audio.mp3", "full_url": "video_pipeline/output/d91ed72a/full.mp4", "timing_url": "video_pipeline/output/d91ed72a/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791689.8960638, "size_bytes": 17570989, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "d91ed72a"}, {"id": "plr-002", "title": "Containers for Beginners: Namespaces, Images, and Why Isolation Is Not Magic", "hook": "Containers feel simple because packaging is simple. Isolation and trust are the hard parts hidden underneath.", "description": "A foundations lesson on what containers are, how they differ from VMs, and why cloud defenders need to care.", "problem": "Beginners treat containers as tiny virtual machines and miss the shared-kernel assumptions that matter for security and operations.", "explanation": "Containers package processes with filesystem, namespace, and runtime isolation primitives, but they do not create full hardware-level separation. Experts care about image provenance, privilege flags, syscall exposure, mounted secrets, and orchestrator policy because those define the real security posture. Container literacy is foundational since many cloud-native workloads, CI systems, and attack paths depend on understanding this packaging and isolation model.", "summary": "Learn containers as a process-isolation and packaging model, not as magic mini-servers.", "lesson_id": "plr-002", "concept_id": "container-basics", "concept": "container-basics", "category": "roadmap-foundation", "difficulty": 1, "mask_url": "video_pipeline/output/971a67b8/mask.webm", "audio_url": "video_pipeline/output/971a67b8/audio.mp3", "full_url": "video_pipeline/output/971a67b8/full.mp4", "timing_url": "video_pipeline/output/971a67b8/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791688.8960638, "size_bytes": 15770629, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "971a67b8"}, {"id": "plr-001", "title": "Linux for Cloud Security: Processes, Permissions, and Operational Reality", "hook": "Cloud security engineers live in abstractions until an incident drags them back down to the operating system.", "description": "A beginner-to-intermediate lesson on Linux essentials that actually matter for cloud security work.", "problem": "People jump straight into cloud consoles without understanding the host concepts underneath: users, groups, processes, sockets, filesystems, and permissions.", "explanation": "Linux fluency matters because cloud workloads, containers, CI runners, and incident response all eventually reduce to operating-system behavior. Experts expect familiarity with process trees, privilege boundaries, service managers, network listeners, file ownership, ACLs, and shell automation because these explain how cloud misconfigurations turn into concrete exposure. Even when a provider abstracts the infrastructure, the workload still inherits OS realities such as credential files, package drift, weak daemon hardening, and insecure permissions.", "summary": "Cloud security starts higher up, but real debugging and compromise paths still terminate in Linux behavior.", "lesson_id": "plr-001", "concept_id": "linux-foundations", "concept": "linux-foundations", "category": "roadmap-foundation", "difficulty": 1, "mask_url": "video_pipeline/output/2475649c/mask.webm", "audio_url": "video_pipeline/output/2475649c/audio.mp3", "full_url": "video_pipeline/output/2475649c/full.mp4", "timing_url": "video_pipeline/output/2475649c/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785791687.8960638, "size_bytes": 18266506, "source_repo": "https://pwnedlabs.io/resources/cloud-security-engineer-roadmap", "source_pdf": "https://pwnedlabs.io/hubfs/Cloud%20Security%20Engineer%20Roadmap%20by%20Pwned%20Labs.pdf", "source_media_id": "2475649c"}, {"id": "gha-070", "title": "Human-in-the-Loop Reliability: Runbooks, Escalation, and Operator Load", "hook": "Many systems are only as resilient as the humans who must interpret them under pressure at 3 a.m.", "description": "A deeper lesson on operational cognition, runbook architecture, escalation paths, and designing systems that are understandable during incidents.", "problem": "Automation handles the easy paths, leaving humans to face the weirdest failures with incomplete context, noisy alerts, and brittle procedures.", "explanation": "Human-in-the-loop reliability recognizes operators as part of the system. Experts design observability, dashboards, runbooks, and escalation workflows so that humans can form accurate mental models quickly under stress. This includes reducing ambiguous alerts, precomputing likely hypotheses, preserving forensic context, and deciding where automation should stop rather than guessing dangerously. Systems that are impossible to reason about in crisis are operationally fragile no matter how elegant the architecture looked beforehand.", "summary": "Resilient architecture supports human decision-making as carefully as it supports machine automation.", "lesson_id": "gha-070", "concept_id": "human-in-loop-reliability", "concept": "human-in-loop-reliability", "category": "availability", "difficulty": 4, "mask_url": "video_pipeline/output/10e72169/mask.webm", "audio_url": "video_pipeline/output/10e72169/audio.mp3", "full_url": "video_pipeline/output/10e72169/full.mp4", "timing_url": "video_pipeline/output/10e72169/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789756.8960638, "size_bytes": 17101328, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "10e72169"}, {"id": "gha-069", "title": "Control Loops and Autoscaling Stability", "hook": "Autoscaling is a control loop, and bad control loops oscillate, overreact, and sometimes magnify the problem they were meant to solve.", "description": "A focused lesson on scaling signals, cooldowns, metric lag, queue-based scaling, and stable elasticity design.", "problem": "Architectures rely on autoscaling without understanding metric delay, warm-up cost, or how downstream bottlenecks make extra replicas irrelevant.", "explanation": "Autoscaling decisions are only as good as the signals and response time behind them. Experts distinguish leading from lagging indicators, choose whether CPU, concurrency, queue depth, or latency is the real bottleneck signal, and account for provisioning delay and cold start behavior. Scaling can stabilize throughput or worsen churn depending on how quickly the loop reacts and whether the bottleneck is actually horizontal. Elasticity is control theory wearing cloud clothing.", "summary": "Autoscaling works when signals, delay, and bottleneck reality are aligned. Otherwise it becomes noisy motion without relief.", "lesson_id": "gha-069", "concept_id": "autoscaling-control-loops", "concept": "autoscaling-control-loops", "category": "stability", "difficulty": 4, "mask_url": "video_pipeline/output/e570ed21/mask.webm", "audio_url": "video_pipeline/output/e570ed21/audio.mp3", "full_url": "video_pipeline/output/e570ed21/full.mp4", "timing_url": "video_pipeline/output/e570ed21/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789755.8960638, "size_bytes": 17034224, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "e570ed21"}, {"id": "gha-068", "title": "Compensating Actions: Undo in Systems That Cannot Roll Back", "hook": "When distributed workflows cannot be atomically rolled back, recovery becomes a business design problem as much as a technical one.", "description": "A deeper lesson on compensation semantics, irreversibility, human review paths, and saga recovery design.", "problem": "Teams talk about compensating transactions casually even when some real-world side effects cannot be undone or can only be partially reversed.", "explanation": "A compensating action is not a magical inverse. It is a deliberate follow-up step that aims to restore acceptable business state after partial completion. Experts distinguish reversible technical effects from irreversible external effects like emails, shipments, payments, or access disclosures. The architecture should encode what can be compensated automatically, what requires human escalation, and how compensations remain idempotent under replay. Compensation design is where distributed system theory meets business reality.", "summary": "Compensation is not rollback. It is controlled damage repair when atomic reversal is impossible.", "lesson_id": "gha-068", "concept_id": "compensating-actions", "concept": "compensating-actions", "category": "stability", "difficulty": 5, "mask_url": "video_pipeline/output/6eb6d932/mask.webm", "audio_url": "video_pipeline/output/6eb6d932/audio.mp3", "full_url": "video_pipeline/output/6eb6d932/full.mp4", "timing_url": "video_pipeline/output/6eb6d932/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789754.8960638, "size_bytes": 16834085, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "6eb6d932"}, {"id": "gha-067", "title": "Timeout Architecture: Deadlines, Budgets, and Resource Protection", "hook": "A timeout is really a policy about how much resource and patience one dependency is allowed to consume.", "description": "A focused lesson on deadline propagation, layered timeouts, per-hop budgets, and how timeout strategy shapes overload behavior.", "problem": "Systems often set arbitrary timeout values independently at each layer, causing wasted work, duplicate retries, and confusing failure semantics.", "explanation": "Timeout architecture works best when requests carry an overall deadline that downstream hops respect. Experts derive per-hop budgets from user expectations, queueing behavior, and fallback possibilities rather than default library values. Too-short timeouts create thrash; too-long timeouts exhaust shared resources and delay recovery. Proper timeout design is one of the simplest and most powerful ways to protect system stability.", "summary": "Timeouts should reflect service budgets and dependency value, not arbitrary numbers copied from examples.", "lesson_id": "gha-067", "concept_id": "timeout-architecture", "concept": "timeout-architecture", "category": "stability", "difficulty": 4, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789753.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-066", "title": "Correlated Failure: Why Redundant Components Still Fall Together", "hook": "Redundancy helps only until many replicas depend on the same fragile thing.", "description": "A deeper lesson on common-mode failure across software versions, admin workflows, infrastructure providers, and hidden shared services.", "problem": "Architectures duplicate components but still share configuration systems, rollout pipelines, human procedures, or platform dependencies that cause synchronized failure.", "explanation": "Correlated failure is what turns apparently independent paths into one real failure domain. Experts examine shared code versions, identity providers, DNS, control planes, secrets, monitoring, and operational commands that can simultaneously affect all replicas. Diversity, staged rollout, and true dependency separation can reduce this risk, but only if common-mode paths are explicitly identified. Otherwise redundancy becomes comforting theater.", "summary": "Independent copies are not enough. Study what can break them together.", "lesson_id": "gha-066", "concept_id": "correlated-failure", "concept": "correlated-failure", "category": "availability", "difficulty": 5, "mask_url": "video_pipeline/output/e570ed21/mask.webm", "audio_url": "video_pipeline/output/e570ed21/audio.mp3", "full_url": "video_pipeline/output/e570ed21/full.mp4", "timing_url": "video_pipeline/output/e570ed21/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789752.8960638, "size_bytes": 17034224, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "e570ed21"}, {"id": "gha-065", "title": "Disaster Recovery Objectives: RTO, RPO, and What They Really Imply", "hook": "RTO and RPO are not paperwork fields. They are architecture promises with cost and design consequences.", "description": "A focused lesson on recovery time objective, recovery point objective, data durability posture, and practical design implications.", "problem": "Organizations set aggressive recovery targets without matching them to replication, backup frequency, automation quality, or operator readiness.", "explanation": "RTO defines how long a service may remain unavailable; RPO defines how much recent data loss is acceptable. Experts translate those targets into architecture decisions around sync versus async replication, backup cadence, warm versus cold standby, automation maturity, and rehearsal frequency. Unrealistic objectives create dangerous illusions because executives think recovery is faster or cleaner than the system can actually deliver. Recovery goals are only credible when the design and practice support them.", "summary": "Recovery targets should be engineered, rehearsed, and evidenced, not merely declared.", "lesson_id": "gha-065", "concept_id": "dr-objectives", "concept": "dr-objectives", "category": "availability", "difficulty": 4, "mask_url": "video_pipeline/output/27e2daad/mask.webm", "audio_url": "video_pipeline/output/27e2daad/audio.mp3", "full_url": "video_pipeline/output/27e2daad/full.mp4", "timing_url": "video_pipeline/output/27e2daad/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789751.8960638, "size_bytes": 15017203, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "27e2daad"}, {"id": "gha-064", "title": "Quorum Systems: Availability, Consistency, and Failure Tolerance", "hook": "Quorums look elegant on slides because the hard part is hidden in timeout, partition, and operator reality.", "description": "A deeper lesson on quorum reads and writes, split-brain prevention, leader election assumptions, and operational tradeoffs.", "problem": "Teams choose replicated consensus or quorum-backed storage without understanding the latency, recovery, and partition behaviors they are buying.", "explanation": "Quorum systems maintain correctness by requiring overlapping agreement sets, but that correctness depends on failure assumptions, membership stability, and time-sensitive coordination. Experts examine how leader changes behave under load, what clients see during partitions, and how maintenance or slow disks affect effective availability. Quorums can preserve integrity brilliantly while still producing user-visible slowness or write unavailability. Architecture must reconcile theoretical guarantees with service expectations.", "summary": "Quorums are not free reliability. They are precise tradeoffs among consistency, latency, and failure tolerance.", "lesson_id": "gha-064", "concept_id": "quorum-systems", "concept": "quorum-systems", "category": "availability", "difficulty": 5, "mask_url": "video_pipeline/output/27e2daad/mask.webm", "audio_url": "video_pipeline/output/27e2daad/audio.mp3", "full_url": "video_pipeline/output/27e2daad/full.mp4", "timing_url": "video_pipeline/output/27e2daad/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789750.8960638, "size_bytes": 15017203, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "27e2daad"}, {"id": "gha-063", "title": "Deployment Rollback Architecture: Designing Reversal Before Release", "hook": "Rollback is easy only when the architecture expected failure before the release happened.", "description": "A lesson on reversible schema changes, feature flags, immutable artifacts, and deployment-state recovery paths.", "problem": "Many deployments can roll code back but cannot roll data shape, asynchronous side effects, or config drift back safely.", "explanation": "Rollback architecture requires release engineering, data migration, and runtime configuration to be designed as one system. Experts favor backward-compatible schemas, staged migrations, feature flag kill switches, immutable artifacts, and one-way changes only when the recovery plan is explicit. The hardest part is asynchronous state: jobs, events, or external side effects triggered by bad code do not disappear when binaries revert. Good rollback design shrinks the class of unrecoverable releases.", "summary": "A deploy is reversible only when code, config, schema, and side effects were designed to retreat safely together.", "lesson_id": "gha-063", "concept_id": "rollback-architecture", "concept": "rollback-architecture", "category": "scalability", "difficulty": 4, "mask_url": "video_pipeline/output/8c06f258/mask.webm", "audio_url": "video_pipeline/output/8c06f258/audio.mp3", "full_url": "video_pipeline/output/8c06f258/full.mp4", "timing_url": "video_pipeline/output/8c06f258/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789749.8960638, "size_bytes": 17202527, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "8c06f258"}, {"id": "gha-062", "title": "Canary Metrics: What to Measure Before Expanding a Release", "hook": "A canary without the right metrics is only a delayed full rollout.", "description": "A deeper lesson on selecting release health signals, comparison baselines, and automatic promotion or rollback thresholds.", "problem": "Teams run canaries but promote based on intuition or infrastructure noise rather than metrics that reflect real user harm or platform regression.", "explanation": "Canary metrics should represent both technical health and business-critical behavior: error budgets, latency shifts, saturation, auth outcomes, workflow completion, and rollback-safe leading indicators. Experts also compare against stable cohorts rather than absolute values because normal variation can mask real regressions. Good canary evaluation is fast enough to support delivery yet strict enough to stop bad change before blast radius grows. Measurement design is what makes progressive delivery defensible.", "summary": "Choose canary metrics that reveal user and system regression early, not just charts that move when anything changes.", "lesson_id": "gha-062", "concept_id": "canary-metrics", "concept": "canary-metrics", "category": "scalability", "difficulty": 4, "mask_url": "video_pipeline/output/8c06f258/mask.webm", "audio_url": "video_pipeline/output/8c06f258/audio.mp3", "full_url": "video_pipeline/output/8c06f258/full.mp4", "timing_url": "video_pipeline/output/8c06f258/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789748.8960638, "size_bytes": 17202527, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "8c06f258"}, {"id": "gha-061", "title": "Message Ordering: When Sequence Is a Security and Correctness Requirement", "hook": "Many event-driven systems are eventually consistent. Fewer are correctly ordered when it matters.", "description": "A focused lesson on ordering guarantees, partition-local sequence, causal consistency, and the cost of preserving order at scale.", "problem": "Architectures emit events freely but discover later that out-of-order handling corrupts state machines, revocations, or fraud defenses.", "explanation": "Ordering is expensive because scale prefers parallelism, but some workflows truly depend on sequence. Experts determine where absolute order matters, where partial order is enough, and where idempotent last-write-wins logic is acceptable. Queue partitioning, version vectors, monotonic counters, or state-machine guards can preserve correctness if used consciously. Ignoring ordering simply pushes complexity into incident response and data repair.", "summary": "Not every stream needs total order, but every architecture should know which workflows break when sequence drifts.", "lesson_id": "gha-061", "concept_id": "message-ordering", "concept": "message-ordering", "category": "scalability", "difficulty": 5, "mask_url": "video_pipeline/output/6eb6d932/mask.webm", "audio_url": "video_pipeline/output/6eb6d932/audio.mp3", "full_url": "video_pipeline/output/6eb6d932/full.mp4", "timing_url": "video_pipeline/output/6eb6d932/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789747.8960638, "size_bytes": 16834085, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "6eb6d932"}, {"id": "gha-060", "title": "Read-Write Splitting and Consistency Debt", "hook": "Read replicas make scale look easy until stale reads break the business rule everyone assumed was immediate.", "description": "A deeper lesson on replicas, lag, monotonic reads, consistency expectations, and user-visible anomalies.", "problem": "Teams offload reads for scale but never define which reads must see writes immediately and which may tolerate lag.", "explanation": "Read-write splitting changes application semantics because write acknowledgment and global visibility become different events. Experts classify workflows that need read-after-write consistency, monotonic session views, or strong transactional guarantees, then route or design accordingly. Replica lag is not only a performance detail; it can break authorization, inventory, financial state, and user trust. Scaling read traffic safely requires explicit consistency contracts.", "summary": "Read scaling changes truth timing. Make that timing explicit before replicas redefine correctness for you.", "lesson_id": "gha-060", "concept_id": "read-write-splitting", "concept": "read-write-splitting", "category": "scalability", "difficulty": 4, "mask_url": "video_pipeline/output/2ae00c90/mask.webm", "audio_url": "video_pipeline/output/2ae00c90/audio.mp3", "full_url": "video_pipeline/output/2ae00c90/full.mp4", "timing_url": "video_pipeline/output/2ae00c90/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789746.8960638, "size_bytes": 16796863, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "2ae00c90"}, {"id": "gha-059", "title": "Hot Partition Failures in Distributed Data Systems", "hook": "Many distributed systems fail not because of average traffic, but because one key becomes disproportionately popular.", "description": "A focused lesson on skewed access patterns, shard imbalance, hotspot mitigation, and adaptive partitioning strategies.", "problem": "Architectures that assume even distribution are surprised when celebrity tenants, trending objects, or bursty workflows overload one shard while the rest of the fleet sits idle.", "explanation": "Hot partitions emerge when partition keys do not match real access patterns. Experts detect them through per-key latency, saturation, and queue depth rather than aggregate fleet metrics. Mitigations include composite partitioning, request coalescing, caching, fan-out reduction, write batching, or moving the hotspot to infrastructure that can absorb it. Partition strategy is therefore both a scaling and availability concern.", "summary": "Distributed scale depends on key distribution. One hot shard can dominate the experience of an otherwise large fleet.", "lesson_id": "gha-059", "concept_id": "hot-partitions", "concept": "hot-partitions", "category": "scalability", "difficulty": 5, "mask_url": "video_pipeline/output/32d377ca/mask.webm", "audio_url": "video_pipeline/output/32d377ca/audio.mp3", "full_url": "video_pipeline/output/32d377ca/full.mp4", "timing_url": "video_pipeline/output/32d377ca/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789745.8960638, "size_bytes": 16485544, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "32d377ca"}, {"id": "gha-058", "title": "Tenant-Aware Logging: Visibility Without Cross-Tenant Leakage", "hook": "Logging architecture can accidentally become one of the largest cross-tenant data exposure surfaces in the platform.", "description": "A deeper lesson on multi-tenant telemetry segregation, field-level redaction, access scopes, and incident forensics.", "problem": "Shared logging pipelines often ingest identifiers, payload fragments, and operational metadata without clear tenant boundaries or need-to-know access controls.", "explanation": "Tenant-aware logging starts by deciding which events need tenant context and which should remain platform-level only. Experts then design partitioning, access control, redaction, retention, and query tooling so support and engineering teams can investigate issues without overexposure. Logging is especially sensitive because it aggregates signals from many layers and can preserve secrets or personal data long after the original transaction ended. Good observability respects tenancy as much as the data plane does.", "summary": "Logs are data systems too. Multi-tenant platforms must isolate telemetry as deliberately as customer workloads.", "lesson_id": "gha-058", "concept_id": "tenant-aware-logging", "concept": "tenant-aware-logging", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/d0af26de/mask.webm", "audio_url": "video_pipeline/output/d0af26de/audio.mp3", "full_url": null, "timing_url": "video_pipeline/output/d0af26de/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789744.8960638, "size_bytes": 2412405, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "d0af26de"}, {"id": "gha-057", "title": "Data Lineage as Security Evidence", "hook": "If you do not know where sensitive data came from or where it went, your controls are probably weaker than you think.", "description": "A focused lesson on lineage graphs, provenance, transformation tracking, and how security and compliance rely on data flow visibility.", "problem": "Data spreads through ETL, enrichment, analytics, and export paths faster than policy can keep up when lineage is incomplete or stale.", "explanation": "Lineage is more than governance metadata. In security terms, it lets teams identify where sensitive data was copied, transformed, masked, exposed, or retained beyond intention. Experts use lineage to scope incidents, validate minimization, and prove that downstream systems inherited the right controls from upstream sources. Without lineage, remediation becomes guesswork and audits become trust exercises rather than evidence-based review.", "summary": "Lineage turns data protection from static policy into traceable, defensible system behavior.", "lesson_id": "gha-057", "concept_id": "data-lineage-security", "concept": "data-lineage-security", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/29b93320/mask.webm", "audio_url": "video_pipeline/output/29b93320/audio.mp3", "full_url": "video_pipeline/output/29b93320/full.mp4", "timing_url": "video_pipeline/output/29b93320/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789743.8960638, "size_bytes": 16117311, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "29b93320"}, {"id": "gha-056", "title": "Data Classification Architecture: Making Sensitivity Enforceable", "hook": "Classification is useful only when systems can act on it consistently.", "description": "A deeper lesson on sensitivity labels, metadata propagation, policy enforcement, and how classification becomes operational control.", "problem": "Organizations label data conceptually but fail to propagate those labels into storage policy, access control, retention, and monitoring decisions.", "explanation": "Data classification architecture bridges semantics and enforcement. Experts define not only categories like public, internal, confidential, or regulated, but also how those categories travel with data through warehouses, APIs, documents, events, and backups. Labels must influence encryption, retention, DLP rules, residency, and sharing policy, or they remain advisory at best. Classification becomes valuable when systems can reason over it without humans re-interpreting the meaning every time.", "summary": "Sensitivity labels matter only when architecture turns them into enforceable behavior across the data lifecycle.", "lesson_id": "gha-056", "concept_id": "data-classification-architecture", "concept": "data-classification-architecture", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/29b93320/mask.webm", "audio_url": "video_pipeline/output/29b93320/audio.mp3", "full_url": "video_pipeline/output/29b93320/full.mp4", "timing_url": "video_pipeline/output/29b93320/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789742.8960638, "size_bytes": 16117311, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "29b93320"}, {"id": "gha-055", "title": "Session Architecture: Lifetime, Reauthentication, and Risk Changes", "hook": "A session is a standing trust decision stretched across time. Good architecture decides how often that trust must be re-earned.", "description": "A lesson on session issuance, renewal, reauthentication triggers, token binding assumptions, and risk-adaptive session control.", "problem": "Long-lived sessions reduce friction but can silently preserve trust after devices, networks, or threat conditions change.", "explanation": "Session architecture defines how authentication evidence is converted into ongoing access. Experts separate primary auth events from session continuation, then decide which changes in risk, device state, location, or privilege require revalidation. The system also has to reconcile user experience with revocation speed, especially for sensitive operations that happen inside an otherwise valid session. Strong session design treats time as part of the trust model, not merely as an expiration field.", "summary": "Session lifetime is a security design choice. The question is not only when sessions expire, but when they should stop being trusted.", "lesson_id": "gha-055", "concept_id": "session-architecture", "concept": "session-architecture", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/0de303b9/mask.webm", "audio_url": "video_pipeline/output/0de303b9/audio.mp3", "full_url": "video_pipeline/output/0de303b9/full.mp4", "timing_url": "video_pipeline/output/0de303b9/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789741.8960638, "size_bytes": 11241882, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "0de303b9"}, {"id": "gha-054", "title": "Identity Propagation Across Service Chains", "hook": "As requests cross services, identity often becomes less trustworthy exactly where decisions become most important.", "description": "A detailed lesson on delegated identity, claims transformation, service assertions, and end-user context across multi-hop request paths.", "problem": "Architectures either drop end-user identity too early or over-propagate raw user claims into places that should only trust service-level assertions.", "explanation": "Identity propagation is the problem of preserving enough subject context to make correct decisions without spreading excessive authority everywhere. Experts distinguish user identity, workload identity, and delegated permission scope, then choose how each crosses service boundaries. Some hops need the end-user context for authorization or audit, while others should operate on constrained service assertions to avoid confused deputy problems. The architecture must also handle token size, lifetime, replay risk, and trust translation between systems that do not share the same identity semantics.", "summary": "Carry only the identity context each hop truly needs, and be precise about where authority is delegated versus merely described.", "lesson_id": "gha-054", "concept_id": "identity-propagation", "concept": "identity-propagation", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/3f16ad52/mask.webm", "audio_url": "video_pipeline/output/3f16ad52/audio.mp3", "full_url": "video_pipeline/output/3f16ad52/full.mp4", "timing_url": "video_pipeline/output/3f16ad52/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789740.8960638, "size_bytes": 20571754, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "3f16ad52"}, {"id": "gha-053", "title": "Key Hierarchies and Envelope Encryption", "hook": "Encryption architecture is not just about choosing an algorithm. It is about choosing how many keys exist, who can use them, and what compromise they limit.", "description": "A deeper lesson on root keys, data encryption keys, wrapping keys, tenant scoping, and crypto domain separation.", "problem": "Flat key models make compromise recovery expensive and blur which blast radius belongs to which key or tenant.", "explanation": "Key hierarchies let systems separate master trust anchors from high-volume data encryption keys. Experts use envelope encryption to keep data operations efficient while tightly controlling access to wrapping keys in KMS or HSM-backed systems. The hierarchy can also express tenant boundaries, environment separation, and revocation scopes, making crypto architecture part of blast-radius design. The deeper lesson is that cryptography becomes operationally manageable only when key relationships mirror trust relationships.", "summary": "Hierarchical key design turns encryption from a checkbox into a controllable trust structure.", "lesson_id": "gha-053", "concept_id": "key-hierarchies", "concept": "key-hierarchies", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/af37ca80/mask.webm", "audio_url": "video_pipeline/output/af37ca80/audio.mp3", "full_url": "video_pipeline/output/af37ca80/full.mp4", "timing_url": "video_pipeline/output/af37ca80/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789739.8960638, "size_bytes": 17205778, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "af37ca80"}, {"id": "gha-052", "title": "Secret Distribution: Retrieval Patterns, Rotation, and Exposure Windows", "hook": "Most secret problems are not about generating keys. They are about how secrets move, where they rest, and how long they remain valid.", "description": "A focused lesson on runtime secret retrieval, short-lived credentials, envelope access, and rotation-safe application design.", "problem": "Applications often load secrets at startup and keep them forever, which turns rotation into downtime and compromise into long-lived exposure.", "explanation": "Secret distribution architecture has to answer how workloads discover secrets, how access is authenticated, how rotation propagates, and what happens if retrieval paths degrade. Expert patterns favor workload identities, on-demand retrieval, bounded caching, and decoupling applications from the assumption that credentials are static. Rotation safety matters because many systems can technically rotate secrets but cannot do so without restart storms or broken sessions. The best designs shrink exposure windows while keeping the platform operable during planned and unplanned rotation.", "summary": "A strong secret system minimizes how long secrets exist, how widely they spread, and how painful it is to rotate them.", "lesson_id": "gha-052", "concept_id": "secret-distribution", "concept": "secret-distribution", "category": "principle", "difficulty": 4, "mask_url": "video_pipeline/output/af37ca80/mask.webm", "audio_url": "video_pipeline/output/af37ca80/audio.mp3", "full_url": "video_pipeline/output/af37ca80/full.mp4", "timing_url": "video_pipeline/output/af37ca80/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789738.8960638, "size_bytes": 17205778, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "af37ca80"}, {"id": "gha-051", "title": "Authorization Architecture: PDP, PEP, and Policy Decision Locality", "hook": "Authorization fails less often because of missing rules than because of bad architecture about where rules are evaluated and enforced.", "description": "A deeper lesson on policy decision points, policy enforcement points, contextual authorization, and distributed policy consistency.", "problem": "Teams centralize policy logic without considering latency and availability, or decentralize it so much that enforcement drifts and auditability disappears.", "explanation": "Authorization architecture is the design of who evaluates policy, who enforces it, what context is required, and how decisions are observed. Expert systems separate policy decision points from enforcement points so rules can evolve independently while still being applied close enough to the action to remain reliable. The hard part is locality: a remote decision service may be correct but too slow or too fragile for every hot path, while local caches may become stale exactly when entitlements change. Strong designs choose which decisions must be strongly fresh, which can tolerate bounded staleness, and how denials, partial context, and degraded-mode behavior should work.", "summary": "Authorization quality depends on policy locality, freshness, and enforcement reliability, not only on rule syntax.", "lesson_id": "gha-051", "concept_id": "authorization-architecture", "concept": "authorization-architecture", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/cc9f449a/mask.webm", "audio_url": "video_pipeline/output/cc9f449a/audio.mp3", "full_url": "video_pipeline/output/cc9f449a/full.mp4", "timing_url": "video_pipeline/output/cc9f449a/timing.json", "background_url": "video_pipeline/backgrounds/minecraft.mp4", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789737.8960638, "size_bytes": 18767305, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "cc9f449a"}, {"id": "gha-050", "title": "Steady-State Hypotheses: How to Design Better Chaos Experiments", "hook": "Chaos experiments are only useful when you can define what 'healthy enough' means before you break anything.", "description": "A subtopic lesson on choosing meaningful steady-state indicators for resilience experiments and incident rehearsal.", "problem": "Teams run failure drills but cannot tell whether outcomes were acceptable because no success criteria were defined ahead of time.", "explanation": "A steady-state hypothesis specifies the user-visible or system-level condition expected to remain within bounds during a controlled fault. Experts choose indicators tied to service value: completion rate, queue drain time, auth success rate, or recovery time for a critical path. This keeps experiments honest and prevents chaos work from becoming vague theater. Strong hypotheses create reusable resilience evidence.", "summary": "Define steady state first. Otherwise failure testing produces stories, not knowledge.", "lesson_id": "gha-050", "concept_id": "steady-state-hypotheses", "concept": "steady-state-hypotheses", "category": "stability", "difficulty": 4, "mask_url": "video_pipeline/output/08c259c6/mask.webm", "audio_url": "video_pipeline/output/08c259c6/audio.mp3", "full_url": "video_pipeline/output/08c259c6/full.mp4", "timing_url": "video_pipeline/output/08c259c6/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789736.8960638, "size_bytes": 14820246, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "08c259c6"}, {"id": "gha-049", "title": "Control Plane Risk: Securing the Systems That Control the System", "hook": "The most dangerous path in many architectures is not the data plane. It is the path that changes policy for the whole platform.", "description": "A focused lesson on control-plane security, admin paths, delegated authority, automation permissions, and global blast radius.", "problem": "Organizations harden workload paths while leaving deployment, policy, or identity control planes with broad permissions and weak operational separation.", "explanation": "Control planes make high-impact decisions: who may deploy, what routes exist, what secrets are available, what policies are enforced. Expert architectures isolate them aggressively with tiered administration, privileged workstations, break-glass design, auditable workflows, and narrow automation identities. They also separate control-plane failure from data-plane continuity wherever possible. A weak control plane can invalidate otherwise strong workload isolation instantly.", "summary": "Protect control planes like crown jewels. They are leverage points over every other safeguard.", "lesson_id": "gha-049", "concept_id": "control-plane-risk", "concept": "control-plane-risk", "category": "principle", "difficulty": 5, "mask_url": "video_pipeline/output/40d6c469/mask.webm", "audio_url": "video_pipeline/output/40d6c469/audio.mp3", "full_url": null, "timing_url": "video_pipeline/output/40d6c469/timing.json", "background_url": "video_pipeline/backgrounds/gameplay_01.webm", "background_options": ["video_pipeline/backgrounds/gameplay_01.webm", "video_pipeline/backgrounds/minecraft.mp4"], "updated_at": 1785789735.8960638, "size_bytes": 2464813, "source_repo": "https://github.com/paulveillard/cybersecurity-architecture", "source_media_id": "40d6c469"}, {"id": "gha-048", "title": "Multi-Tenant Isolation: Efficiency Without Shared Fate", "hook": "Multi-tenancy is an efficiency pattern until weak isolation turns one tenant's problem into everyone's incident.", "d
